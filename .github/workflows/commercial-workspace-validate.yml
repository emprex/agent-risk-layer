name: Temporary commercial workspace validation

on:
  push:
    branches:
      - validate/commercial-workspace-ux

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Isolate Control Intelligence suite
        run: NODE_ENV=test node --test tests/control-intelligence.test.js
