name: Temporary failure handoff validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arl_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d arl_disposable_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: NODE_ENV=test node --test tests/control-intelligence.test.js tests/control-intelligence-failure-handoff.test.js
      - run: npm test
      - run: node scripts/test-control-intelligence-postgres.mjs
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arl_disposable_test
