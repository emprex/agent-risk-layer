name: Verify production prospect enrichment deployment

on:
  push:
    branches:
      - fix/verified-prospect-enrichment-20260810

permissions:
  contents: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check production readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://agent-risk-layer.onrender.com/api/ready | tee ready.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('ready.json', 'utf8'));
          if (data.ok !== true) throw new Error(`Production readiness failed: ${JSON.stringify(data)}`);
          console.log('\nPRODUCTION_READY', JSON.stringify(data));
          NODE

      - name: Check custom domain readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://agentrisklayer.com/api/ready | tee custom-ready.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('custom-ready.json', 'utf8'));
          if (data.ok !== true) throw new Error(`Custom-domain readiness failed: ${JSON.stringify(data)}`);
          console.log('\nCUSTOM_DOMAIN_READY', JSON.stringify(data));
          NODE

      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git switch -C "${GITHUB_REF_NAME}"
          git config user.name "AgentRiskLayer automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/verify-production-enrichment.yml
          git commit -m "Remove temporary production verification workflow"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
