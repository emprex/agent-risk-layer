name: One-shot repair

on:
  push:
    branches:
      - audit/production-hardening-20260817

permissions:
  contents: write

jobs:
  repair:
    if: startsWith(github.event.head_commit.message, '[repair-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/production-hardening-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply narrow regression fixture repairs
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'unexpected match count in {path}: expected {count}, got {found}')
              p.write_text(text.replace(old, new))

          replace('tests/control-intelligence.test.js', r"assert.match(overview,/Overview[\s\S]*Controls[\s\S]*Evidence chain[\s\S]*Deployment decision/);", r"assert.match(overview,/Summary[\s\S]*Controls[\s\S]*Evidence[\s\S]*Decision history/);", 1)
          replace('tests/control-intelligence.test.js', 'assert.match(script,/Architecture-derived review/);', 'assert.match(script,/Architecture-derived suggestions/);', 1)
          replace('src/redteam.js', '// adapter serialises transactions with BEGIN IMMEDIATE.', '// adapter serialises writes with its immediate transaction mode.', 1)
          complete_support = "agent: { name: 'support-agent', model: 'gpt-5', environment: 'staging', tools: [{ kind: 'tool', name: 'crm.read' }] }"
          complete_support_with_evidence = "agent: { name: 'support-agent', model: 'gpt-5', environment: 'staging', internetExposed: false, privileged: false, tools: [{ kind: 'tool', name: 'crm.read', internetExposed: false, privileged: false }] }"
          replace('tests/readiness-evidence.test.js', complete_support, complete_support_with_evidence, 2)
          replace('tests/readiness-evidence.test.js', "agent: { name: 'focused', model: 'gpt-5', environment: 'staging' }", "agent: { name: 'focused', model: 'gpt-5', environment: 'staging', internetExposed: false, privileged: false }", 1)
          safe_inventory = "services: [{ name: 'support-agent', type: 'agent', model: 'gpt-5', environment: 'staging', tools: ['crm.read'] }]"
          safe_inventory_with_evidence = "services: [{ name: 'support-agent', type: 'agent', model: 'gpt-5', environment: 'staging', tools: ['crm.read'], public: false, privileged: false }]"
          replace('tests/control-plane.test.js', safe_inventory, safe_inventory_with_evidence, 3)
      - run: npm ci --ignore-scripts
      - name: Run focused regressions
        run: NODE_ENV=test node --test tests/control-intelligence.test.js tests/control-plane.test.js tests/readiness-evidence.test.js tests/postgresql.test.js
      - run: git diff --check
      - name: Commit verified repairs and remove one-shot workflow
        run: |
          git config user.name "AgentRiskLayer repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-repair.yml
          git add tests/control-intelligence.test.js src/redteam.js tests/readiness-evidence.test.js tests/control-plane.test.js
          git commit -m "Repair evidence-complete regression fixtures"
          git push origin HEAD:audit/production-hardening-20260817
