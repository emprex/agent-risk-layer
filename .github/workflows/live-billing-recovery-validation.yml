name: Live billing recovery validation

on:
  push:
    branches:
      - validate/live-billing-recovery-20260814

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate production readiness and billing surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://agentrisklayer.com/api/ready -o /tmp/ready.json
          curl --fail --silent --show-error --max-time 20 https://agentrisklayer.com/api/config -o /tmp/config.json
          PRICING_STATUS="$(curl --silent --show-error --output /tmp/pricing.html --write-out '%{http_code}' --max-time 20 https://agentrisklayer.com/pricing.html)"
          echo "ready=$(cat /tmp/ready.json)"
          echo "config_summary=$(jq -c '{productStage,demoMode,catalogue}' /tmp/config.json)"
          echo "pricing_status=$PRICING_STATUS"
          jq -e '(.ok == true) or (.ready == true)' /tmp/ready.json >/dev/null
          jq -e '.productStage == "production"' /tmp/config.json >/dev/null
          jq -e '.demoMode == false' /tmp/config.json >/dev/null
          jq -e '.catalogue.pro_report.amountPence == 9900' /tmp/config.json >/dev/null
          jq -e '.catalogue.developer_monthly.amountPence == 2900' /tmp/config.json >/dev/null
          jq -e '.catalogue.team_monthly.amountPence == 9900' /tmp/config.json >/dev/null
          jq -e '.catalogue.agency_monthly.amountPence == 24900' /tmp/config.json >/dev/null
          test "$PRICING_STATUS" = "200"
          grep -q 'pricingGrid' /tmp/pricing.html

      - name: Verify checkout endpoint remains authenticated
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --output /tmp/checkout.json --write-out '%{http_code}' --max-time 20 -X POST https://agentrisklayer.com/api/checkout -H 'content-type: application/json' --data '{"productKey":"developer_monthly"}')"
          echo "checkout_unauthenticated_status=$STATUS"
          cat /tmp/checkout.json
          test "$STATUS" = "401"
