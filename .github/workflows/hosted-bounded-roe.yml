name: Hosted Bounded RoE

on:
  push:
    branches:
      - fix-hosted-bounded-roe
    paths:
      - 'src/agent/hosted-bounded-roe-api.mjs'
      - 'src/hosted-agent-api-preload.js'
      - 'tests/phase4-hosted-bounded-roe.test.js'
      - '.github/workflows/hosted-bounded-roe.yml'
  pull_request:
    paths:
      - 'src/agent/hosted-bounded-roe-api.mjs'
      - 'src/hosted-agent-api-preload.js'
      - 'tests/phase4-hosted-bounded-roe.test.js'
      - '.github/workflows/hosted-bounded-roe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-bounded-roe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax checks
        run: |
          node --check src/agent/hosted-bounded-roe-api.mjs
          node --check src/hosted-agent-api-preload.js

      - name: Hosted bounded-test RoE tests
        run: NODE_ENV=test node --test tests/phase4-hosted-bounded-roe.test.js

      - name: Prove hosted RoE stays local-only and fail-closed
        run: |
          grep -q "environment: 'local'" src/agent/hosted-bounded-roe-api.mjs
          grep -q "syntheticDataOnly: true" src/agent/hosted-bounded-roe-api.mjs
          grep -q "dryRunToolsOnly: true" src/agent/hosted-bounded-roe-api.mjs
          grep -q "noProductionEffects: true" src/agent/hosted-bounded-roe-api.mjs
          grep -q "authorise_and_run_bounded_test" src/agent/hosted-bounded-roe-api.mjs
          echo 'HOSTED_BOUNDED_ROE_FAIL_CLOSED'
