name: Temporary assessment continuation validation

on:
  push:
    branches:
      - fix/assessment-continuation

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused customer-continuation patch
        run: |
          python3 .github/temporary-assessment-continuation.py
          python3 .github/temporary-assessment-continuation-test-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run unit and integration tests
        run: npm test
      - name: Run release validation
        run: npm run validate
      - name: Check patch hygiene
        run: git diff --check -- . ':(exclude)public/downloads/agentrisklayer-sample-professional-report.pdf'
      - name: Commit validated patch and remove temporary files
        run: |
          rm .github/workflows/temporary-assessment-continuation.yml .github/temporary-assessment-continuation.py .github/temporary-assessment-continuation-test-fix.py
          git add public/assessment.html public/assessment.js public/result.js public/public-result.js public/dashboard.js server.js src/report.js src/pdf.js CUSTOMER_JOURNEY_V10.md tests/customer-journey.test.js public/downloads/agentrisklayer-sample-professional-report.pdf .github/workflows/temporary-assessment-continuation.yml .github/temporary-assessment-continuation.py .github/temporary-assessment-continuation-test-fix.py
          expected=".github/temporary-assessment-continuation-test-fix.py .github/temporary-assessment-continuation.py .github/workflows/temporary-assessment-continuation.yml CUSTOMER_JOURNEY_V10.md public/assessment.html public/assessment.js public/dashboard.js public/downloads/agentrisklayer-sample-professional-report.pdf public/public-result.js public/result.js server.js src/pdf.js src/report.js tests/customer-journey.test.js"
          actual="$(git diff --cached --name-only | sort | tr '\n' ' ' | sed 's/ $//')"
          wanted="$(printf '%s\n' $expected | sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$wanted" ]; then echo "Unexpected staged files: $actual"; exit 1; fi
          git config user.name "emprex"
          git config user.email "guillaume.strohecker@gmail.com"
          git commit -m "Improve assessment clarification flow"
          git push origin HEAD:fix/assessment-continuation
