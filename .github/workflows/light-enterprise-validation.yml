name: Light enterprise site validation

on:
  push:
    branches:
      - design/light-enterprise-site-20260814

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: npm run check
      - name: Light enterprise contracts
        run: node --test tests/premium-visual-system.test.js tests/flagship-art-direction.test.js tests/visual-experience.test.js tests/experience-design.test.js tests/commercial-workspace-ux.test.js tests/workspace-architecture-v2.test.js
      - name: Browser acceptance
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory public >/tmp/arl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });

          async function inspectPublic(name, viewport) {
            const page = await browser.newPage({ viewport });
            const consoleErrors = [];
            page.on('pageerror', (error) => consoleErrors.push(String(error)));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });
            const state = await page.evaluate(() => {
              const body = getComputedStyle(document.body);
              const headerElement = document.querySelector('[data-site-header]');
              const header = getComputedStyle(headerElement);
              const headerBefore = getComputedStyle(headerElement, '::before');
              const h1 = getComputedStyle(document.querySelector('h1'));
              const preview = document.querySelector('.product-preview');
              const consent = document.querySelector('.analytics-consent');
              const labels = [...document.querySelectorAll('[data-primary-navigation] a')].map((node) => node.textContent.trim());
              return {
                bg: body.backgroundColor,
                bgImage: body.backgroundImage,
                color: body.color,
                headerBg: header.backgroundColor,
                headerBeforeDisplay: headerBefore.display,
                h1Size: parseFloat(h1.fontSize),
                h1Color: h1.color,
                overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                previewVisible: Boolean(preview && preview.getBoundingClientRect().height > 200),
                consentBg: consent ? getComputedStyle(consent).backgroundColor : '',
                labels,
              };
            });
            console.log(name, state, consoleErrors);
            if (state.bg !== 'rgb(255, 255, 255)') throw new Error(`${name}: public background is not white: ${state.bg}`);
            if (state.bgImage !== 'none') throw new Error(`${name}: public background still uses cinematic imagery`);
            if (state.headerBeforeDisplay !== 'none') throw new Error(`${name}: legacy dark header pseudo-layer remains visible`);
            if (state.h1Size > (viewport.width < 700 ? 50 : 70)) throw new Error(`${name}: headline remains oversized: ${state.h1Size}`);
            if (state.overflow > 1) throw new Error(`${name}: horizontal overflow ${state.overflow}px`);
            if (!state.previewVisible) throw new Error(`${name}: product preview is not visibly present`);
            if (state.consentBg && !state.consentBg.startsWith('rgba(255, 255, 255') && state.consentBg !== 'rgb(255, 255, 255)') {
              throw new Error(`${name}: consent surface is not light: ${state.consentBg}`);
            }
            const expectedLabels = ['Product', 'How it works', 'Pricing', 'Trust', 'Sign in', 'Check an agent free'];
            if (JSON.stringify(state.labels) !== JSON.stringify(expectedLabels)) {
              throw new Error(`${name}: public navigation differs from simplified IA: ${state.labels.join(' | ')}`);
            }
            if (consoleErrors.length) throw new Error(`${name}: page errors: ${consoleErrors.join(' | ')}`);
            await page.screenshot({ path: `light-enterprise-${name}.png`, fullPage: true });
            await page.close();
          }

          async function inspectWorkspace(viewport) {
            const css = [
              fs.readFileSync('public/styles.css', 'utf8'),
              fs.readFileSync('public/design-tokens.css', 'utf8'),
              fs.readFileSync('public/security-workspace.css', 'utf8'),
              fs.readFileSync('public/workspace-app.css', 'utf8'),
              fs.readFileSync('public/workspace-light.css', 'utf8'),
            ].join('\n');
            const page = await browser.newPage({ viewport });
            await page.setContent(`<style>${css}</style><body data-shell="app"><header class="site-header site-header-v10 app-header-v10"><a class="brand brand-v10"><span class="brand-mark">AR</span><span><strong>AgentRiskLayer</strong><small>Security workspace</small></span></a><nav class="primary-navigation"><a aria-current="page">Overview</a><a>Assess</a><a>Findings</a><a>Evidence</a><a>Runtime</a><a>Settings</a><a>Help</a></nav></header><main class="app-shell wide"><header class="workspace-page-header"><span class="eyebrow">Overview</span><h1>AI agent security</h1><p>Read the current posture and take the next action.</p></header><section class="workspace-agent-command"><div class="workspace-agent-command-head"><div class="workspace-agent-identity"><span class="eyebrow">Current agent</span><h2>CLARA</h2><p>Production candidate</p></div></div><div class="workspace-status-grid"><article class="workspace-status-card" data-state="unresolved"><span class="eyebrow">Deployment decision</span><strong>No decision recorded</strong><p>The server has not recorded a deployment decision.</p></article><article class="workspace-status-card" data-state="critical"><span class="eyebrow">Latest assessment</span><strong>High declared risk</strong><p>Supporting declared assessment context.</p></article><aside class="workspace-next-action"><span class="eyebrow">Next action</span><strong>Review the highest-priority finding</strong><p>Attach evidence and retest the exact control.</p><a class="button primary">Open finding</a></aside></div></section></main></body>`);
            const state = await page.evaluate(() => {
              const header = document.querySelector('.site-header');
              return {
                bg: getComputedStyle(document.body).backgroundColor,
                navBg: getComputedStyle(header).backgroundColor,
                headerBeforeDisplay: getComputedStyle(header, '::before').display,
                panelBg: getComputedStyle(document.querySelector('.workspace-agent-command')).backgroundColor,
                overflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
              };
            });
            console.log('workspace', viewport, state);
            if (state.bg !== 'rgb(248, 250, 252)') throw new Error(`workspace: expected light canvas, got ${state.bg}`);
            const acceptableNavBackgrounds = ['rgb(255, 255, 255)', 'rgba(255, 255, 255, 0.96)'];
            if (!acceptableNavBackgrounds.includes(state.navBg)) throw new Error(`workspace: expected white nav, got ${state.navBg}`);
            if (state.headerBeforeDisplay !== 'none') throw new Error('workspace: legacy dark header pseudo-layer remains visible');
            if (state.panelBg !== 'rgb(255, 255, 255)') throw new Error(`workspace: expected white panel, got ${state.panelBg}`);
            if (state.overflow > 1) throw new Error(`workspace: horizontal overflow ${state.overflow}px`);
            await page.screenshot({ path: `light-enterprise-workspace-${viewport.width}.png`, fullPage: true });
            await page.close();
          }

          await inspectPublic('desktop', { width: 1440, height: 1000 });
          await inspectPublic('mobile', { width: 390, height: 844 });
          await inspectWorkspace({ width: 1440, height: 1000 });
          await inspectWorkspace({ width: 390, height: 844 });
          await browser.close();
          EOF
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-enterprise-screenshots
          path: light-enterprise-*.png
          if-no-files-found: warn
      - name: Full regression suite
        run: npm test
