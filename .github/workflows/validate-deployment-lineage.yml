name: Validate deployment lineage fix
on:
  push:
    branches: [fix/deployment-closed-lineage]
permissions:
  contents: write
jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'Run deployment lineage validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/patch-deployment-closed-lineage.py
      - run: npm ci
      - run: npm run check
      - run: node --test tests/control-intelligence-redteam-binding.test.js
      - run: npm test
      - name: Commit validated patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/control-intelligence-core.js tests/control-intelligence-redteam-binding.test.js
          git commit -m '[skip ci] Apply deployment closed lineage fix'
          git push origin HEAD:fix/deployment-closed-lineage
