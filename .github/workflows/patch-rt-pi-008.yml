name: Patch RT-PI-008 matrix
on:
  push:
    branches: [fix/rt-pi-008-bounded-matrix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rt-pi-008-bounded-matrix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-rt-pi-008-matrix.mjs
      - run: node --test tests/approval-binding-matrix.test.js tests/redteam.test.js
      - name: Commit generated runner changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add redteam/agent-risk-redteam.mjs public/downloads/agent-risk-redteam.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enforce RT-PI-008 five-probe runner matrix"
          git push
