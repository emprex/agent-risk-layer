name: Owner assessment case validation
on:
  push:
    branches: [fix/owner-assessment-cases-20260810]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arl_owner_case_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arl_owner_case_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Fetch exact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=5 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git switch -C "${GITHUB_REF_NAME}"
      - name: Implement owner assessment cases
        run: |
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f"{label}: expected one match, found {count}"
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              assert count == 1, f"{label}: expected one regex match, found {count}"
              return updated

          migration = '''-- Owner-only evidence assessment cases.
          -- These projects reuse the existing tenant/project evidence model but are deliberately
          -- excluded from runtime project entitlements and cannot issue runtime credentials.
          CREATE TABLE IF NOT EXISTS owner_assessment_cases (
            project_id TEXT PRIMARY KEY REFERENCES security_projects(id) ON DELETE CASCADE,
            workspace_id TEXT NOT NULL REFERENCES workspaces(id) ON DELETE CASCADE,
            created_by TEXT NOT NULL REFERENCES users(id) ON DELETE RESTRICT,
            created_at TEXT NOT NULL,
            UNIQUE(project_id, workspace_id)
          );

          CREATE INDEX IF NOT EXISTS idx_owner_assessment_cases_workspace
            ON owner_assessment_cases(workspace_id, created_at DESC);
          '''.replace('          ', '')
          Path('migrations/019_owner_assessment_cases.sql').write_text(migration)

          p = Path('src/control-plane.js')
          s = p.read_text()
          s = replace_once(
              s,
              "});\n\nconst PROJECT_ENVIRONMENTS",
              "});\n\nexport const PROJECT_KINDS = Object.freeze({ RUNTIME: 'runtime', ASSESSMENT_CASE: 'assessment_case' });\n\nconst PROJECT_ENVIRONMENTS",
              'project kind constants',
          )

          new_create = '''export async function createSecurityProject({ userId, workspaceId, name, environment = 'development', projectKind = PROJECT_KINDS.RUNTIME }) {
            const membership = await workspaceMembership(workspaceId, userId);
            if (!membership || !MANAGE_ROLES.has(membership.role)) throw forbidden('Workspace developer, admin or owner access is required.');
            const cleanName = clean(name, 100);
            if (cleanName.length < 2) throw badRequest('Project name must contain at least two characters.');
            const cleanEnvironment = PROJECT_ENVIRONMENTS.has(environment) ? environment : 'development';
            const normalizedProjectKind = clean(projectKind, 40).toLowerCase() || PROJECT_KINDS.RUNTIME;
            if (!Object.values(PROJECT_KINDS).includes(normalizedProjectKind)) throw badRequest('Unknown project kind.');
            const assessmentCase = normalizedProjectKind === PROJECT_KINDS.ASSESSMENT_CASE;
            if (assessmentCase && (membership.role !== 'owner' || !await isPlatformSuperuser(userId))) {
              throw forbidden('Only the AgentRiskLayer owner may create assessment cases.');
            }
            const billingUserId = await workspaceBillingUser(workspaceId);
            const entitlement = await entitlementForUser(billingUserId);
            if (!assessmentCase) {
              const projectCount = Number((await db.prepare(`SELECT COUNT(*) count FROM security_projects p
                WHERE p.billing_user_id=? AND p.status!='archived'
                  AND NOT EXISTS (SELECT 1 FROM owner_assessment_cases c WHERE c.project_id=p.id)`).get(billingUserId)).count || 0);
              if (projectCount >= entitlement.projects) throw paymentRequired(`${entitlement.name} supports ${entitlement.projects} active project${entitlement.projects === 1 ? '' : 's'}. Upgrade to add another.`);
            }
            const projectId = id('prj_');
            const timestamp = nowIso();
            const slug = await availableSlug(workspaceId, slugify(cleanName));
            const policy = compileRuntimePolicy(defaultProjectPolicy(cleanEnvironment));
            const policyDigest = policyIdentityDigest(policy, projectId);
            await db.transaction(async () => {
              await db.prepare(`INSERT INTO security_projects
                (id,workspace_id,billing_user_id,created_by,name,slug,environment,status,policy_json,policy_version,policy_digest,policy_published_at,retention_days,created_at,updated_at)
                VALUES (?,?,?,?,?,?,?,'active',?,?,?,?,?,?,?)`)
                .run(projectId, workspaceId, billingUserId, userId, cleanName, slug, cleanEnvironment, JSON.stringify(policy), policy.version, policyDigest, timestamp,
                  Math.min(entitlement.retentionDays, cleanEnvironment === 'production' ? 90 : entitlement.retentionDays), timestamp, timestamp);
              if (assessmentCase) {
                await db.prepare(`INSERT INTO owner_assessment_cases (project_id,workspace_id,created_by,created_at) VALUES (?,?,?,?)`)
                  .run(projectId, workspaceId, userId, timestamp);
              }
              await audit({ workspaceId, projectId, actorType: 'user', actorId: userId, action: 'project.created', targetType: 'project', targetId: projectId,
                metadata: { environment: cleanEnvironment, projectKind: normalizedProjectKind } });
            });
            return getSecurityProject({ projectId, userId });
          }

          export async function listSecurityProjects'''
          s = regex_once(
              s,
              r"export async function createSecurityProject\(\{ userId, workspaceId, name, environment = 'development' \}\) \{.*?\n\}\n\nexport async function listSecurityProjects",
              new_create,
              'createSecurityProject',
          )

          new_list = '''export async function listSecurityProjects(userId) {
            const rows = await db.prepare(`SELECT p.*,m.role,
                CASE WHEN ac.project_id IS NULL THEN 'runtime' ELSE 'assessment_case' END project_kind,
                (SELECT COUNT(*) FROM project_api_keys k WHERE k.project_id=p.id AND k.revoked_at IS NULL) api_key_count,
                (SELECT COUNT(*) FROM runtime_events e WHERE e.project_id=p.id AND e.created_at>=?) runtime_requests_month,
                (SELECT COUNT(*) FROM runtime_events e WHERE e.project_id=p.id AND e.decision='deny' AND e.created_at>=?) denied_month,
                (SELECT MAX(created_at) FROM runtime_events e WHERE e.project_id=p.id) last_runtime_event_at,
                (SELECT MAX(created_at) FROM asset_snapshots a WHERE a.project_id=p.id) last_inventory_at,
                (SELECT summary_json FROM asset_snapshots a WHERE a.project_id=p.id ORDER BY created_at DESC LIMIT 1) latest_inventory_summary,
                (SELECT COUNT(*) FROM remediation_items r WHERE r.project_id=p.id AND r.status NOT IN ('verified','closed','verified_closed','accepted_risk')) open_remediations
              FROM security_projects p
              JOIN workspace_members m ON m.workspace_id=p.workspace_id
              JOIN users actor ON actor.id=m.user_id
              LEFT JOIN owner_assessment_cases ac ON ac.project_id=p.id AND ac.workspace_id=p.workspace_id
              WHERE m.user_id=? AND m.status='active'
                AND (ac.project_id IS NULL OR actor.role='superuser')
              ORDER BY p.created_at DESC`).all(monthStart(), monthStart(), userId);
            return Promise.all(rows.map(async (row) => {
              const keys = await db.prepare('SELECT expires_at,revoked_at FROM project_api_keys WHERE project_id=?').all(row.id);
              return publicProject({ ...row, api_key_count: keys.filter((key) => apiKeyStatus(key) === 'active').length });
            }));
          }

          export async function getSecurityProject'''
          s = regex_once(
              s,
              r"export async function listSecurityProjects\(userId\) \{.*?\n\}\n\nexport async function getSecurityProject",
              new_list,
              'listSecurityProjects',
          )

          for declaration, label in [
              ("export async function createProjectApiKey({ projectId, userId, name = 'Runtime key', expiresAt = null }) {", 'createProjectApiKey'),
              ("export async function createRuntimeApproval({ projectId, userId, toolCall, ttlSeconds = 600, controlId = null, systemSnapshotId = null }) {", 'createRuntimeApproval'),
              ("export async function runGuidedProtectionCheck({ projectId, userId }) {", 'runGuidedProtectionCheck'),
          ]:
              s = replace_once(s, declaration, declaration + "\n  await assertRuntimeProject({ projectId, userId });", label)

          new_overview = '''export async function controlPlaneOverview(userId) {
            const projects = await listSecurityProjects(userId);
            const runtimeProjects = projects.filter((item) => item.projectKind !== PROJECT_KINDS.ASSESSMENT_CASE);
            const assessmentProjects = projects.filter((item) => item.projectKind === PROJECT_KINDS.ASSESSMENT_CASE && item.status !== 'archived');
            const entitlement = await entitlementForUser(userId);
            return {
              projects,
              totals: {
                projects: runtimeProjects.filter((item) => item.status !== 'archived').length,
                assessmentCases: assessmentProjects.length,
                runtimeRequestsMonth: runtimeProjects.reduce((sum, item) => sum + Number(item.runtimeRequestsMonth || 0), 0),
                deniedMonth: runtimeProjects.reduce((sum, item) => sum + Number(item.deniedMonth || 0), 0),
                openRemediations: runtimeProjects.reduce((sum, item) => sum + Number(item.openRemediations || 0), 0),
                assets: runtimeProjects.reduce((sum, item) => sum + Number(item.latestInventoryTotal || 0), 0),
              },
              entitlement,
              assessmentCases: {
                canCreate: await isPlatformSuperuser(userId),
                ownerOnly: true,
                runtimeEnabled: false,
                count: assessmentProjects.length,
                projects: assessmentProjects,
              },
            };
          }

          export async function purgeExpiredRuntimeEvents'''
          s = regex_once(
              s,
              r"export async function controlPlaneOverview\(userId\) \{.*?\n\}\n\nexport async function purgeExpiredRuntimeEvents",
              new_overview,
              'controlPlaneOverview',
          )

          new_access = '''async function projectAccess(projectId, userId) {
            const row = await db.prepare(`SELECT p.*,m.role,
              CASE WHEN ac.project_id IS NULL THEN 'runtime' ELSE 'assessment_case' END project_kind
              FROM security_projects p
              JOIN workspace_members m ON m.workspace_id=p.workspace_id
              JOIN users actor ON actor.id=m.user_id
              LEFT JOIN owner_assessment_cases ac ON ac.project_id=p.id AND ac.workspace_id=p.workspace_id
              WHERE p.id=? AND m.user_id=? AND m.status='active'
                AND (ac.project_id IS NULL OR actor.role='superuser')`).get(projectId, userId);
            return row ? { project: row, role: row.role } : null;
          }

          async function requireProjectRole(projectId, userId, roles, lock=false) {
            const access = lock && db.kind==='postgres' ? (()=>db.prepare(`SELECT p.*,m.role,
              CASE WHEN ac.project_id IS NULL THEN 'runtime' ELSE 'assessment_case' END project_kind
              FROM security_projects p
              JOIN workspace_members m ON m.workspace_id=p.workspace_id
              JOIN users actor ON actor.id=m.user_id
              LEFT JOIN owner_assessment_cases ac ON ac.project_id=p.id AND ac.workspace_id=p.workspace_id
              WHERE p.id=? AND m.user_id=? AND m.status='active'
                AND (ac.project_id IS NULL OR actor.role='superuser') FOR UPDATE OF p`).get(projectId,userId).then(row=>row?{project:row,role:row.role}:null))() : projectAccess(projectId, userId);
            const resolved=await access;
            if (!resolved || !roles.has(resolved.role)) throw forbidden('Project not found or permission denied.');
            return resolved;
          }

          async function isPlatformSuperuser(userId) {
            const row = await db.prepare('SELECT role FROM users WHERE id=?').get(userId);
            return row?.role === 'superuser';
          }

          async function assertRuntimeProject({ projectId, userId }) {
            const access = await projectAccess(projectId, userId);
            if (!access) throw forbidden('Project not found or permission denied.');
            if ((access.project.project_kind || PROJECT_KINDS.RUNTIME) === PROJECT_KINDS.ASSESSMENT_CASE) {
              throw forbidden('Owner assessment cases are evidence-only and do not provide runtime protection capabilities.');
            }
            return access;
          }

          async function workspaceMembership'''
          s = regex_once(
              s,
              r"async function projectAccess\(projectId, userId\) \{.*?\n\}\n\nasync function requireProjectRole\(projectId, userId, roles, lock=false\) \{.*?\n\}\n\nasync function workspaceMembership",
              new_access,
              'project access isolation',
          )

          s = replace_once(
              s,
              "function publicProject(row) {\n  const policy = parseJson(row.policy_json, {});\n  return {",
              "function publicProject(row) {\n  const policy = parseJson(row.policy_json, {});\n  const projectKind = row.project_kind === PROJECT_KINDS.ASSESSMENT_CASE ? PROJECT_KINDS.ASSESSMENT_CASE : PROJECT_KINDS.RUNTIME;\n  return {",
              'publicProject declaration',
          )
          s = replace_once(
              s,
              "id: row.id, workspaceId: row.workspace_id, billingUserId: row.billing_user_id, name: row.name, slug: row.slug,\n    environment:",
              "id: row.id, workspaceId: row.workspace_id, billingUserId: row.billing_user_id, name: row.name, slug: row.slug,\n    projectKind, runtimeEnabled: projectKind === PROJECT_KINDS.RUNTIME,\n    environment:",
              'publicProject fields',
          )
          p.write_text(s)

          p = Path('server.js')
          s = p.read_text()
          s = replace_once(
              s,
              "createSecurityProject({ userId: req.user.id, workspaceId, name: body.name, environment: body.environment })",
              "createSecurityProject({ userId: req.user.id, workspaceId, name: body.name, environment: body.environment, projectKind: body.projectKind })",
              'project route kind',
          )
          p.write_text(s)

          p = Path('src/db-adapters/sqlite-local.js')
          s = p.read_text()
          s = replace_once(
              s,
              "  '016_control_intelligence_journey.sql',\n]) {",
              "  '016_control_intelligence_journey.sql',\n  '019_owner_assessment_cases.sql',\n]) {",
              'sqlite owner case migration',
          )
          s = s.replace('// Risk knowledge migrations are intentionally loaded into the test-only SQLite\n// adapter so route and tenant-isolation tests exercise the same schema and seed\n// content used by PostgreSQL production migrations.',
                        '// Additive evidence-model migrations are intentionally loaded into the test-only SQLite\n// adapter so route and tenant-isolation tests exercise the same schema and seed\n// content used by PostgreSQL production migrations.')
          p.write_text(s)

          p = Path('public/control-plane.js')
          s = p.read_text()
          s = replace_once(
              s,
              "let guidedCheck = null;\n\nconst severityOrder",
              "let guidedCheck = null;\nconst runtimeProjects = () => (overview?.projects || []).filter((item) => item.projectKind !== 'assessment_case');\n\nconst severityOrder",
              'runtime project helper',
          )
          s = replace_once(
              s,
              "    if (selectedProjectId && overview.projects.some((item) => item.id === selectedProjectId)) await loadProject(selectedProjectId);\n    else if (overview.projects[0]) await loadProject(overview.projects[0].id);",
              "    const availableRuntimeProjects = runtimeProjects();\n    if (selectedProjectId && availableRuntimeProjects.some((item) => item.id === selectedProjectId)) await loadProject(selectedProjectId);\n    else if (availableRuntimeProjects[0]) await loadProject(availableRuntimeProjects[0].id);",
              'runtime project init',
          )

          new_guided_context = '''function guidedProjectContext() {
            const projects = runtimeProjects();
            const canCreate = projects.length < overview.entitlement.projects;
            return `<section class="guided-project-context" aria-label="Current protected agent">
              <div class="guided-project-identity"><span class="project-icon">${escapeHtml(project.name.slice(0, 2).toUpperCase())}</span><div><small>Protected agent</small><strong>${escapeHtml(project.name)}</strong><span>${escapeHtml(plainEnvironment(project.environment))} · ${formatNumber(project.entitlement?.usage?.requests || 0)} checks this month</span></div></div>
              ${projects.length > 1 ? `<label class="guided-project-switcher">Change agent<select id="guidedProjectSelect">${projects.map((item) => `<option value="${escapeHtml(item.id)}" ${item.id === project.id ? 'selected' : ''}>${escapeHtml(item.name)}</option>`).join('')}</select></label>` : `<div class="guided-plan-summary"><strong>${escapeHtml(overview.entitlement.name)}</strong><span>${canCreate ? 'You can add another project.' : 'Your plan includes one active project.'}</span>${canCreate ? '<button class="text-button" data-open-technical="project">Add another agent</button>' : '<a href="/pricing.html">Need more projects?</a>'}</div>`}
            </section>`;
          }

          function overviewHeader'''
          s = regex_once(s, r"function guidedProjectContext\(\) \{.*?\n\}\n\nfunction overviewHeader", new_guided_context, 'guided project context')

          new_rail = '''function projectRail() {
            const projects = runtimeProjects();
            const canCreate = projects.length < overview.entitlement.projects;
            const planMessage = canCreate
              ? `${overview.entitlement.name} includes ${overview.entitlement.projects} active project${overview.entitlement.projects === 1 ? '' : 's'}.`
              : `${overview.entitlement.name} includes ${overview.entitlement.projects} active project${overview.entitlement.projects === 1 ? '' : 's'}. You are already using ${overview.entitlement.projects === 1 ? 'it' : 'them'}.`;
            return `<aside class="project-rail customer-project-rail">
              <div class="rail-heading"><span class="eyebrow">Your protected agents</span><small>${projects.length || '0'} active</small></div>
              <div class="project-list">${projects.map(projectButton).join('') || '<p class="muted small-copy">Your first protected agent will appear here.</p>'}</div>
              ${canCreate && projects.length ? `<details class="rail-create-details"><summary>Add another agent</summary>${projectCreateForm()}</details>` : ''}
              <div class="entitlement-card plain-plan-card"><strong>${escapeHtml(overview.entitlement.name)}</strong><span>${escapeHtml(planMessage)}</span><span>${formatNumber(overview.entitlement.runtimeRequestsPerMonth)} protection checks each month</span>${canCreate ? '' : '<a href="/pricing.html">Need more projects? Compare plans →</a>'}</div>
            </aside>`;
          }

          function projectButton'''
          s = regex_once(s, r"function projectRail\(\) \{.*?\n\}\n\nfunction projectButton", new_rail, 'project rail')

          owner_panel = '''function ownerAssessmentCasePanel() {
            if (!overview.assessmentCases?.canCreate) return '';
            const cases = overview.assessmentCases.projects || [];
            return `<section class="panel owner-assessment-cases">
              <div class="section-heading compact-heading"><div><span class="eyebrow">Owner-only assessment workspace</span><h2>Assessment cases</h2></div><strong>${cases.length}</strong></div>
              <p>Create isolated design-partner or customer evidence cases without consuming the Community live-protection project allowance. Assessment cases cannot issue runtime keys, runtime approvals or protection quota.</p>
              ${cases.length ? `<div class="plain-event-list">${cases.map((item) => `<div><span class="plain-decision allow">Case</span><div><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(plainEnvironment(item.environment))} · evidence-only</small></div><a class="button ghost small" href="/control-intelligence.html?projectId=${encodeURIComponent(item.id)}">Open Control Intelligence</a></div>`).join('')}</div>` : '<p class="muted">No owner assessment cases yet.</p>'}
              <form id="createAssessmentCase" class="mini-form rail-form">
                <label for="assessmentCaseName">Assessment case name</label>
                <input id="assessmentCaseName" name="name" required minlength="2" maxlength="100" placeholder="CLARA Security Assessment">
                <button class="button primary" type="submit">Create assessment case</button>
              </form>
            </section>`;
          }

          '''
          s = replace_once(s, "function emptyProject() {", owner_panel + "function emptyProject() {", 'assessment case panel')
          s = replace_once(s, "    ${guidedProgress(stage)}\n    <section class=\"panel human-next-card", "    ${guidedProgress(stage)}\n    ${ownerAssessmentCasePanel()}\n    <section class=\"panel human-next-card", 'assessment panel placement')
          s = replace_once(s, "    ${projectCreateForm()}\n  </section>`;", "    ${projectCreateForm()}\n    ${ownerAssessmentCasePanel()}\n  </section>`;", 'empty project assessment panel')
          s = replace_once(s, "  document.querySelector('#createProject')?.addEventListener('submit', createProject);", "  document.querySelector('#createProject')?.addEventListener('submit', createProject);\n  document.querySelector('#createAssessmentCase')?.addEventListener('submit', createAssessmentCase);", 'assessment form binding')

          create_case = '''async function createAssessmentCase(event) {
            event.preventDefault();
            const button = event.currentTarget.querySelector('button');
            setBusy(button, true, 'Creating assessment case…');
            try {
              const result = await api('/api/projects', { method: 'POST', body: JSON.stringify({
                workspaceId: project?.workspaceId || undefined,
                name: document.querySelector('#assessmentCaseName').value,
                environment: 'development',
                projectKind: 'assessment_case',
              }) });
              location.href = `/control-intelligence.html?projectId=${encodeURIComponent(result.project.id)}`;
            } catch (error) { fail(error); setBusy(button, false); }
          }

          '''
          s = replace_once(s, "async function createKey(event) {", create_case + "async function createKey(event) {", 'create assessment case handler')
          p.write_text(s)

          tests = '''import test from 'node:test';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { db } from '../src/db.js';
          import { createWorkspace, upsertMember } from '../src/workspaces.js';
          import {
            PROJECT_KINDS,
            controlPlaneOverview,
            createProjectApiKey,
            createRuntimeApproval,
            createSecurityProject,
            getSecurityProject,
            listSecurityProjects,
            runGuidedProtectionCheck,
          } from '../src/control-plane.js';
          import { createSystemSnapshot } from '../src/control-intelligence.js';

          async function createUser(role = 'user') {
            const userId = `usr_case_${crypto.randomUUID().replaceAll('-', '')}`;
            const email = `${userId}@example.test`;
            const timestamp = new Date().toISOString();
            await db.prepare('INSERT INTO users (id,email,password_hash,email_verified_at,role,created_at) VALUES (?,?,?,?,?,?)')
              .run(userId, email, 'test-only', timestamp, role, timestamp);
            return { userId, email };
          }

          test('superuser can create an evidence-only assessment case without weakening the Community runtime project limit', async () => {
            const owner = await createUser('superuser');
            const workspace = await createWorkspace(owner.userId, 'Owner assessment workspace');
            const runtimeProject = await createSecurityProject({ userId: owner.userId, workspaceId: workspace.id, name: 'Production Evidence Verification', environment: 'development' });
            assert.equal(runtimeProject.projectKind, PROJECT_KINDS.RUNTIME);
            assert.equal(runtimeProject.runtimeEnabled, true);

            const assessmentCase = await createSecurityProject({ userId: owner.userId, workspaceId: workspace.id, name: 'CLARA Security Assessment', environment: 'development', projectKind: PROJECT_KINDS.ASSESSMENT_CASE });
            assert.equal(assessmentCase.projectKind, PROJECT_KINDS.ASSESSMENT_CASE);
            assert.equal(assessmentCase.runtimeEnabled, false);

            const overview = await controlPlaneOverview(owner.userId);
            assert.equal(overview.entitlement.projects, 1);
            assert.equal(overview.totals.projects, 1);
            assert.equal(overview.totals.assessmentCases, 1);
            assert.equal(overview.assessmentCases.canCreate, true);
            assert.equal(overview.assessmentCases.runtimeEnabled, false);
            assert.equal(overview.assessmentCases.projects[0].id, assessmentCase.id);

            await assert.rejects(
              () => createSecurityProject({ userId: owner.userId, workspaceId: workspace.id, name: 'Second runtime agent', environment: 'development' }),
              /supports 1 active project/i,
            );
            await assert.rejects(() => createProjectApiKey({ projectId: assessmentCase.id, userId: owner.userId }), /evidence-only/i);
            await assert.rejects(() => createRuntimeApproval({ projectId: assessmentCase.id, userId: owner.userId, toolCall: { name: 'file.write', arguments: { path: 'safe.txt' } } }), /evidence-only/i);
            await assert.rejects(() => runGuidedProtectionCheck({ projectId: assessmentCase.id, userId: owner.userId }), /evidence-only/i);

            const snapshotResult = await createSystemSnapshot({ projectId: assessmentCase.id, userId: owner.userId, input: {
              architecture: { summary: 'CLARA exact build with local file, process and Python execution authority.', components: [] },
              assessmentConfiguration: { architectureFacts: ['tool:file', 'tool:code_execution', 'identity:user'], environment: 'development', confirmed: true },
              source: 'guided_customer_review',
            } });
            assert.equal(snapshotResult.snapshot.projectId, assessmentCase.id);
            assert.match(snapshotResult.snapshot.contentDigest, /^[a-f0-9]{64}$/);
          });

          test('assessment cases are restricted to the platform superuser and hidden from ordinary workspace members', async () => {
            const owner = await createUser('superuser');
            const workspace = await createWorkspace(owner.userId, 'Isolated assessment workspace');
            const runtimeProject = await createSecurityProject({ userId: owner.userId, workspaceId: workspace.id, name: 'Normal protected agent', environment: 'development' });
            const assessmentCase = await createSecurityProject({ userId: owner.userId, workspaceId: workspace.id, name: 'Private design partner case', projectKind: PROJECT_KINDS.ASSESSMENT_CASE });

            const member = await createUser('user');
            await upsertMember({ workspaceId: workspace.id, actorId: owner.userId, email: member.email, role: 'admin' });
            const visible = await listSecurityProjects(member.userId);
            assert.ok(visible.some((item) => item.id === runtimeProject.id));
            assert.ok(!visible.some((item) => item.id === assessmentCase.id));
            await assert.rejects(() => getSecurityProject({ projectId: assessmentCase.id, userId: member.userId }), /access denied|not found/i);

            const ordinaryOwner = await createUser('user');
            const ordinaryWorkspace = await createWorkspace(ordinaryOwner.userId, 'Ordinary workspace');
            await assert.rejects(
              () => createSecurityProject({ userId: ordinaryOwner.userId, workspaceId: ordinaryWorkspace.id, name: 'Improper case', projectKind: PROJECT_KINDS.ASSESSMENT_CASE }),
              /only the AgentRiskLayer owner/i,
            );
            const ordinaryOverview = await controlPlaneOverview(ordinaryOwner.userId);
            assert.equal(ordinaryOverview.assessmentCases.canCreate, false);
          });

          test('owner assessment case UI and API contract keep evidence cases separate from runtime projects', () => {
            const client = fs.readFileSync(new URL('../public/control-plane.js', import.meta.url), 'utf8');
            const server = fs.readFileSync(new URL('../server.js', import.meta.url), 'utf8');
            const source = fs.readFileSync(new URL('../src/control-plane.js', import.meta.url), 'utf8');
            assert.match(client, /Owner-only assessment workspace/);
            assert.match(client, /projectKind: 'assessment_case'/);
            assert.match(client, /cannot issue runtime keys, runtime approvals or protection quota/i);
            assert.match(server, /projectKind: body\.projectKind/);
            assert.match(source, /Only the AgentRiskLayer owner may create assessment cases/);
            assert.match(source, /evidence-only and do not provide runtime protection capabilities/);
          });
          '''.replace('          ', '')
          Path('tests/owner-assessment-cases.test.js').write_text(tests)

          docs = '''# Owner assessment cases

          Owner assessment cases are an evidence-only project mode for AgentRiskLayer's platform owner to assess design-partner or customer systems without consuming the owner's normal live-protection project entitlement.

          ## Security boundary

          - Creation requires both the platform `superuser` role and `owner` membership in the target workspace.
          - Assessment cases are hidden from ordinary workspace members, including workspace admins, unless they are the platform superuser.
          - The case reuses the existing project/workspace tenant boundary and Control Intelligence evidence chain.
          - Runtime API keys, runtime approvals and the guided runtime-protection check are denied for assessment cases. A case therefore does not add Guard quota or subscription runtime benefits.
          - Normal runtime projects continue to be counted against the billing owner's plan entitlement; assessment cases are excluded from that count.
          - Existing projects remain normal runtime projects. There is no conversion path and no destructive migration.

          ## Evidence workflow

          Use an assessment case for immutable system snapshots, control applicability, test records, evidence, findings, remediation, exact retesting and deployment-decision support. Public or customer-provided statements remain declarations until an authorised observation or test establishes stronger evidence.

          Rollback should remove application exposure while preserving the additive `owner_assessment_cases` records and all linked assessment evidence. Do not delete case records as a routine rollback because that would destroy evidence lineage.
          '''.replace('          ', '')
          Path('docs/OWNER_ASSESSMENT_CASES.md').write_text(docs)
          PY
