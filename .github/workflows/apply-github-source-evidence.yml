name: Apply GitHub source evidence server route

on:
  push:
    branches:
      - fix/github-source-evidence
    paths:
      - .github/workflows/apply-github-source-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-source-evidence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic server patch
        run: node scripts/apply-github-source-server-route.mjs
      - name: Validate syntax and focused journey tests
        run: |
          node --check server.js
          node --check src/github-source-inspection.js
          node --test tests/github-source-evidence.test.js
      - name: Commit generated server route and remove one-shot patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-github-source-evidence.yml scripts/apply-github-source-server-route.mjs
          git add server.js
          git commit -m "Wire hosted GitHub source evidence into Inspector"
          git push origin HEAD:fix/github-source-evidence
