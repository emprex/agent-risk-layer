name: Validate Red Team chronology fix

on:
  push:
    branches:
      - fix/redteam-execution-chronology
    paths:
      - .github/workflows/redteam-chronology-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/redteam-execution-chronology
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply chronology fix
        run: python3 scripts/apply-redteam-chronology-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Focused chronology tests
        env:
          NODE_ENV: test
        run: node --test tests/control-intelligence-redteam-binding.test.js tests/control-intelligence-redteam-trust.test.js
      - name: Full test suite
        env:
          NODE_ENV: test
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Commit verified fix without temporary CI files
        run: |
          rm -f .github/workflows/redteam-chronology-fix.yml scripts/apply-redteam-chronology-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use signed execution chronology for Red Team retests"
          git push origin HEAD:fix/redteam-execution-chronology
