                  {"description": "Report and human validation",
                   "quantity": 1, "unit_price_minor": 5025}
              ]
          })
          assert window.crm_quote_dialog.isVisible()
          assert window.crm_quote_table.rowCount() == 2
          assert window.crm_quote_table.item(0, 0).text() == "Bounded manual tool review"
          assert window.crm_quote_table.item(1, 0).text() == "Report and human validation"
          assert "301.25" in window.crm_quote_total.text()
          window.crm_quote_dialog.reject()

          window.crm_tabs.setCurrentIndex(4)
          assert calls[-1][0] == "crm-sales-pipeline"
          calls[-1][3]({
              "available": True, "total": 1,
              "lanes": [{
                  "id": "prospecting", "title": "Prospecting", "total": 1,
                  "more": False, "items": [{
                      "id": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee",
                      "prospect_id": "ARL-P-000001",
                      "company_name_at_creation": "Synthetic Research Co.",
                      "stage": "research", "version": 1,
                      "next_action": "Review public company background",
                      "due_date": "2026-11-12"
                  }]
              }]
          }, None)
          window.crm_pipeline_lists["prospecting"].setCurrentRow(0)
          window.open_pipeline_opportunity()
          assert window.crm_followup_dialog.isVisible()
          assert window.crm_followup_stage.currentData() == "research"
          window.crm_followup_stage.setCurrentIndex(
              window.crm_followup_stage.findData("qualified")
          )
          window.crm_followup_action.setPlainText("Operator qualified research lead")
          window.save_followup()
          assert calls[-1][0] == "crm-update-opportunity"
          assert calls[-1][2]["expected_version"] == 1
          assert calls[-1][2]["stage"] == "qualified"
          window.crm_followup_dialog.reject()
          # Closing the operator workspace must close orphan standalone CRM views.
          window.crm_dossier_dialog.show()
          assert window.crm_dossier_dialog.isVisible()
          window.close()
          assert not window.crm_dossier_dialog.isVisible()
          app.quit()
