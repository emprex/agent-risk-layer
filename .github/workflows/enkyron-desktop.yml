name: ENKYRON Desktop

on:
  push:
    branches:
      - 'feat/enkyron-desktop-*'
  pull_request:
    paths:
      - 'desktop/enkyron*'
      - 'tests/enkyron-desktop.test.js'
      - '.github/workflows/enkyron-desktop.yml'

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Node dependencies
        run: npm ci --ignore-scripts
      - name: Desktop bridge and contract tests
        run: |
          node --check desktop/enkyron-contract.mjs
          node --check desktop/enkyron-bridge.mjs
          node --check desktop/enkyron-evidence-register.mjs
          node --check desktop/enkyron-ticket-intake.mjs
          node --check desktop/enkyron-crm-prospects.mjs
          node --check desktop/enkyron-crm.mjs
          node --check desktop/enkyron-crm-link.mjs
          node --check desktop/enkyron-crm-tickets.mjs
          node --check desktop/enkyron-crm-company-dossier.mjs
          node --check desktop/enkyron-crm-qualification.mjs
          node --check scripts/enkyron-crm-qualification-schema.mjs
          node --check desktop/enkyron-crm-opportunities.mjs
          node --check desktop/enkyron-crm-activities.mjs
          node --check desktop/enkyron-crm-mail-drafts.mjs
          node --check desktop/enkyron-crm-overview.mjs
          node --check desktop/enkyron-crm-pipeline.mjs
          node --check scripts/enkyron-crm-mail-schema.mjs
          node --check scripts/enkyron-crm-activity-schema.mjs
          node --check scripts/enkyron-crm-opportunities-schema.mjs
          node --check scripts/enkyron-crm-ticket-schema.mjs
          node --check scripts/enkyron-crm-link-schema.mjs
          node --check scripts/enkyron-crm-schema.mjs
          node --check scripts/enkyron-client-desk-schema.mjs
          node --test tests/enkyron-desktop.test.js tests/enkyron-evidence-register.test.js tests/enkyron-ticket-intake.test.js tests/enkyron-crm-prospects.test.js tests/enkyron-crm.test.js tests/enkyron-crm-link.test.js tests/enkyron-crm-tickets.test.js tests/enkyron-crm-opportunities.test.js tests/enkyron-crm-activities.test.js tests/enkyron-crm-mail-drafts.test.js tests/enkyron-crm-overview.test.js tests/enkyron-crm-pipeline.test.js tests/enkyron-crm-company-dossier.test.js tests/enkyron-crm-qualification.test.js
          python3 -B -m unittest desktop.test_assessment_bridge desktop.test_enkyron_operator_state desktop.test_enkyron_evidence
      - name: Install native Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libxkbcommon0
      - name: Install isolated Qt runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/enkyron-venv"
          "$RUNNER_TEMP/enkyron-venv/bin/python" -m pip install --disable-pip-version-check "PySide6_Essentials>=6.9,<7"
      - name: Native window smoke without PostgreSQL
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/enkyron-venv/bin/python" - <<'PY'
          from PySide6.QtWidgets import QApplication, QLabel, QMainWindow, QListWidgetItem
          from PySide6.QtCore import Qt, QDate
          from desktop.enkyron import DesktopBridge, EnkyronWindow, format_followup_due

          # Verify Qt widget construction without connecting to a DB or running ARL.
          DesktopBridge.call = lambda *_args, **_kwargs: None
          app = QApplication([])
          window = EnkyronWindow()
          assert isinstance(window, QMainWindow)
          assert window.tabs.count() == 7
          assert window.tabs.tabText(4) == 'ARL Engine'
          assert window.tabs.tabText(5) == 'Evidence Requests'
          assert window.tabs.tabText(6) == 'Evidence Register'
          assert window.windowTitle().startswith("ENKYRON")
          assert window.pages.count() == 3
          assert [window.navigation.item(i).text() for i in range(3)] == [
              "Home", "Tickets", "CRM"
          ]
          assert window.pages.currentIndex() == 1
          assert window.ticket_views.count() == 2
          assert window.ticket_views.currentIndex() == 0
          assert window.ticket_list.parentWidget() is not window.tabs.parentWidget()
          assert window.ticket_list.count() == 0
          assert not window.show_archived.isChecked()
          assert not window.assign_button.isEnabled()
          assert not window.archive_button.isEnabled()
          window.open_new_ticket()
          assert window.new_ticket_dialog is not None
          assert window.new_ticket_dialog.isVisible()
          window.intake_client.setText("Synthetic Customer")
          window.intake_contact.setText("Caller")
          window.intake_phone.setText("+44 0000 000000")
          window.intake_title.setText("Telephone enquiry")
          window.intake_description.setPlainText("Customer requests a consultation")
          # The actual bridge is stubbed: verify the native callback and payload.
          intake_calls = []
          DesktopBridge.call = lambda _self,action,arg="",payload=None,callback=None: intake_calls.append(
              (action, arg, payload, callback)
          )
          window.create_ticket()
          assert intake_calls[-1][0] == "create-ticket"
          assert intake_calls[-1][2]["source"] == "phone"
          assert intake_calls[-1][2]["client_name"] == "Synthetic Customer"
          assert "consultation" in intake_calls[-1][2]["request_text"]
          window.new_ticket_dialog.reject()
          # Exercise the real Qt callback path using a stubbed local IPC process.
          calls = []
          def fake_call(_self, action, arg="", payload=None, callback=None):
              calls.append((action, arg, payload, callback))
          DesktopBridge.call = fake_call
          window.navigation.setCurrentRow(2)
          prospect_page_call = next(x for x in calls if x[0] == "crm-prospects-page")
          assert prospect_page_call[2] == {"search": "", "page": 1}
          # CRM now opens three independent views; the follow-up lookup may be last.
          assert any(x[0] == "crm-opportunities" for x in calls)
          prospect_page_call[3]({
              "available": True, "more": True, "total": 344,
              "page": 1, "page_size": 100,
              "items": [{
                  "id": "ARL-P-000001",
                  "company_name": "Synthetic Research Co.",
                  "buyer_name": "Unconfirmed Contact",
                  "buyer_role": "Research",
                  "buyer_email": None,
                  "website": "https://example.invalid",
                  "stage": "research",
                  "source": "synthetic-ci",
                  "updated_at": "2026-11-05T10:00:00Z",
              }]
          }, None)
          assert window.crm_table.rowCount() == 1
          assert window.crm_page_label.text() == "Page 1 / 4"
          assert not window.crm_previous.isEnabled()
          assert window.crm_next.isEnabled()
          window.crm_next.click()
          assert calls[-1][0] == "crm-prospects-page"
          assert calls[-1][2] == {"search": "", "page": 2}
          calls[-1][3]({
              "available": True, "more": True, "total": 344,
              "page": 2, "page_size": 100,
              "items": [{
                  "id": "ARL-P-000101",
                  "company_name": "Page Two Synthetic",
                  "buyer_name": None, "stage": "research",
                  "source": "synthetic-ci", "updated_at": "2026-11-05",
              }],
          }, None)
          assert window.crm_page_label.text() == "Page 2 / 4"
          assert window.crm_previous.isEnabled()
          assert window.crm_next.isEnabled()
          window.crm_previous.click()
          assert calls[-1][2] == {"search": "", "page": 1}
          calls[-1][3]({
              "available": True, "more": True, "total": 344,
              "page": 1, "page_size": 100,
              "items": [{
                  "id": "ARL-P-000001",
                  "company_name": "Synthetic Research Co.",
                  "buyer_name": "Unconfirmed Contact",
                  "buyer_role": "Research",
                  "buyer_email": None,
                  "website": "https://example.invalid",
                  "stage": "research",
                  "source": "synthetic-ci", "updated_at": "2026-11-05",
              }],
          }, None)
          assert window.crm_page_label.text() == "Page 1 / 4"
          company_call = next(item for item in calls if item[0] == "crm-companies")
          company_id = "11111111-2222-4333-8444-555555555555"
          company_call[3]({
              "available": True, "more": False,
              "items": [{
                  "id": company_id, "name": "Synthetic Company",
                  "relationship_state": "prospect", "sector": "Cybersecurity",
                  "city": "London", "country": "UK", "updated_at": "2026-11-05",
              }]
          }, None)
          assert window.crm_tabs.count() == 5
          assert window.crm_tabs.tabText(3) == "Mail"
          assert [window.crm_mail_folders.tabText(i) for i in range(3)] == [
              "Inbox", "Sent", "Drafts"
          ]
          assert "not connected" in window.crm_mail_connection.text().lower()
          assert window.crm_company_table.rowCount() == 1
          assert window.crm_company_add.isEnabled()
          window.crm_company_table.selectRow(0)
          assert calls[-1][0] == "crm-contacts"
          assert calls[-1][1] == company_id
          calls[-1][3]({
              "company": {"id": company_id, "name": "Synthetic Company"},
              "items": [{
                  "full_name": "Synthetic Contact", "job_title": "Engineering",
                  "email": "contact@example.invalid", "phone": "",
              }], "more": False
          }, None)
          assert window.crm_contacts_table.rowCount() == 1
          assert window.crm_company_detail_tabs.count() == 2
          assert window.crm_company_dossier_open.isEnabled()
          window.open_company_dossier()
          assert window.crm_dossier_dialog.isVisible()
          assert calls[-1][0] == "crm-company-dossier"
          assert calls[-1][1] == company_id
          calls[-1][3]({
              "available": True,
              "company": {
                  "id": company_id, "name": "Synthetic Company",
                  "relationship_state": "prospect",
                  "sector": "Cybersecurity", "city": "London",
                  "country": "UK"
              },
              "sections": {
                  "contacts": {
                      "total": 1, "more": False,
                      "items": [{
                          "full_name": "Synthetic Contact",
                          "job_title": "Engineering",
                          "email": "contact@example.invalid",
                          "marketing_permission": "unknown"
                      }]
                  },
                  "prospects": {
                      "total": 1, "more": False,
                      "items": [{
                          "candidate_name": "Reviewed candidate",
                          "source": "synthetic-ci"
                      }]
                  },
                  "tickets": {"total": 0, "more": False, "items": []},
                  "opportunities": {"total": 0, "more": False, "items": []},
                  "activities": {"total": 0, "more": False, "items": []},
                  "qualifications": {"total": 0, "more": False, "items": []},
                  "drafts": {"total": 0, "more": False, "items": []}
              }
          }, None)
          assert "Synthetic Company" in window.crm_dossier_summary.text()
          assert "Relationship: prospect" in window.crm_dossier_summary.text()
          assert window.crm_dossier_tabs.count() == 7
          assert window.crm_dossier_tabs.tabText(0) == "Contacts (1)"
          assert window.crm_dossier_tabs.tabText(1) == "Research links (1)"
          assert window.crm_dossier_tabs.tabText(2) == "Tickets (0)"
          assert window.crm_dossier_tabs.tabText(4) == "Qualification (0)"
          window.crm_dossier_tabs.setCurrentIndex(4)
          qualification_page = window.crm_dossier_tabs.widget(4).widget()
          qualification_labels = [
              child.text() for child in qualification_page.findChildren(QLabel)
          ]
          assert "No qualification reviews recorded yet." in qualification_labels
          assert window.crm_qualification_save.isVisible()
          assert window.crm_qualification_rationale.isVisible()
          assert window.crm_qualification_subject.currentData() is None
          window.crm_qualification_fit.setCurrentIndex(
              window.crm_qualification_fit.findData("potential_fit")
          )
          window.crm_qualification_rationale.setPlainText(
              "Research suggests commercial relevance but client identity is unverified."
          )
          window.crm_qualification_next.setText("Review technical scope manually")
          window.crm_qualification_confirm.setChecked(True)
          window.record_company_qualification()
          assert calls[-1][0] == "crm-record-qualification"
          assert calls[-1][2]["company_id"] == company_id
          assert calls[-1][2]["contact_id"] is None
          assert calls[-1][2]["fit_status"] == "potential_fit"
          assert calls[-1][2]["confirmed"] is True
          window.crm_dossier_dialog.reject()
          ticket_links_call = next(item for item in calls if item[0] == "crm-company-tickets")
          assert ticket_links_call[1] == company_id
          example_ticket_id = "22222222-3333-4444-8555-666666666666"
          ticket_links_call[3]({
              "company": {"id": company_id, "name": "Synthetic Company"},
              "items": [{
                  "ticket_id": example_ticket_id,
                  "ticket_number": "ARL-2026-000009",
                  "title": "Synthetic support request",
                  "client_name": "Historical customer name",
                  "status": "new"
              }], "more": False,
          }, None)
          assert window.crm_company_tickets_table.rowCount() == 1
          window.crm_company_tickets_table.selectRow(0)
          assert window.crm_open_company_ticket_button.isEnabled()
          window.crm_company_detail_tabs.setCurrentIndex(1)
          window.open_ticket_link_dialog()
          assert window.crm_link_dialog.isVisible()
          assert calls[-1][0] == "crm-ticket-options"
          assert calls[-1][1] == ""
          calls[-1][3]({
              "available": True,
              "items": [{
                  "ticket_id": "33333333-4444-4555-8666-777777777777",
                  "ticket_number": "ARL-2026-000010",
                  "title": "Unlinked synthetic ticket",
                  "client_name": "Unverified customer",
                  "status": "scoping",
              }], "more": False,
          }, None)
          assert window.crm_link_ticket_choice.count() == 1
          assert window.crm_link_ticket_submit.isEnabled()
          assert not window.crm_link_ticket_checked.isChecked()
          window.crm_link_dialog.reject()
          window.open_new_company()
          assert window.crm_company_dialog.isVisible()
          window.crm_name_input.setText("Another Synthetic Company")
          window.create_company()
          assert calls[-1][0] == "crm-create-company"
          assert calls[-1][2]["name"] == "Another Synthetic Company"
          window.crm_company_dialog.reject()
          window.open_new_contact()
          assert window.crm_contact_dialog.isVisible()
          window.crm_contact_name_input.setText("Another Synthetic Contact")
          window.create_contact()
          assert calls[-1][0] == "crm-create-contact"
          assert calls[-1][2]["company_id"] == company_id
          window.crm_contact_dialog.reject()
          window.crm_table.selectRow(0)
          assert "NOT A VERIFIED CUSTOMER" in window.crm_details.toPlainText()
          assert window.crm_review_button.isEnabled()
          window.open_prospect_review()
          assert calls[-1][0] == "crm-prospect-review"
          assert calls[-1][1] == "ARL-P-000001"
          calls[-1][3]({
              "available": True,
              "prospect": {
                  "id": "ARL-P-000001",
                  "company_name": "Synthetic Research Co.",
                  "website": "https://example.invalid",
                  "source": "synthetic-ci",
                  "buyer_name": "Unconfirmed Contact",
              },
              "source_digest": "a" * 64,
              "linked": None, "matches": [], "more_matches": False,
          }, None)
          assert window.crm_review_dialog.isVisible()
          summaries = [x.text() for x in window.crm_review_dialog.findChildren(QLabel)]
          assert any("Research candidate: Synthetic Research Co." in x and
                     "Buyer (not verified): Unconfirmed Contact" in x for x in summaries)
          assert window.crm_review_choice.currentData() == {"mode": "create"}
          assert not window.crm_review_check.isChecked()
          window.crm_review_dialog.reject()

          # Follow-ups are available with no registered CRM company.
          assert window.crm_plan_followup.isEnabled()
          assert window.crm_tabs.count() == 5
          window.open_prospect_followup()
          assert calls[-1][0] == "crm-prospect-opportunity"
          assert calls[-1][1] == "ARL-P-000001"
          calls[-1][3]({"available": True, "opportunity": None}, None)
          assert window.crm_followup_dialog.isVisible()
          window.crm_followup_action.setPlainText(
              "Review company technical background before a manual follow-up"
          )
          window.save_followup()
          assert calls[-1][0] == "crm-create-opportunity"
          assert calls[-1][2]["prospect_id"] == "ARL-P-000001"
          assert calls[-1][2]["due_date"] is None
          window.crm_followup_dialog.reject()

          # The third CRM tab lists saved manual actions and supports editing.
          opportunity_call = next(item for item in calls if item[0] == "crm-opportunities")
          opportunity_call[3]({
              "available": True,
              "items": [{
                  "id": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee",
                  "prospect_id": "ARL-P-000001",
                  "company_name_at_creation": "Synthetic Research Co.",
                  "stage": "research", "version": 1,
                  "next_action": "Review published company website",
                  "due_date": "2026-11-12",
                  "updated_at": "2026-11-05"
              }], "more": False,
          }, None)
          assert window.crm_followup_table.rowCount() == 1
          assert format_followup_due(
              "2026-11-06", "research", QDate(2026, 11, 5)
          ).endswith("Tomorrow")
          assert format_followup_due(
              "2026-11-04", "research", QDate(2026, 11, 5)
          ).endswith("Overdue")
          assert format_followup_due(
              "2026-11-04", "won", QDate(2026, 11, 5)
          ).endswith("Closed")
          window.crm_followup_table.selectRow(0)
          assert window.crm_edit_followup.isEnabled()
          assert window.crm_activity_button.isEnabled()
          window.open_activity_history()
          assert window.crm_activity_dialog.isVisible()
          assert calls[-1][0] == "crm-activity-timeline"
          assert calls[-1][1] == "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"
          calls[-1][3]({
              "available": True, "more": False, "items": [{
                  "id": "event-ci", "entry_kind": "change",
                  "event_type": "created", "old_stage": None,
                  "new_stage": "research", "old_next_action": None,
                  "new_next_action": "Review published company website",
                  "actor_local": "ci-operator", "recorded_at": "2026-11-05"
              }], "opportunity": {"id": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"}
          }, None)
          assert window.crm_activity_table.rowCount() == 1
          assert window.crm_activity_save.isEnabled()
          window.crm_activity_table.selectRow(0)
          assert "MANUAL OPPORTUNITY CHANGE" in window.crm_activity_details.toPlainText()
          window.crm_activity_type.setCurrentIndex(1)
          window.crm_activity_detail_input.setPlainText(
              "Operator recorded a research-only call note."
          )
          window.crm_activity_confirm.setChecked(True)
          window.save_activity_note()
          assert calls[-1][0] == "crm-record-activity"
          assert calls[-1][2]["activity_type"] == "call_note"
          assert calls[-1][2]["reviewed"] is True
          assert "research-only call note" in calls[-1][2]["detail"]
          window.crm_activity_dialog.reject()

          # Mail drafts belong to the selected opportunity. No mailbox or send.
          assert window.crm_compose_button.isEnabled()
          window.open_compose_draft()
          assert window.crm_draft_dialog.isVisible()
          assert window.crm_mail_to.text() == ""
          assert window.crm_draft_context["opportunity_id"] == "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"
          window.crm_mail_subject.setText("Synthetic proposal draft")
          window.crm_mail_body.setPlainText(
              "Hello, this is a local draft, not a sent communication."
          )
          window.save_mail_draft()
          assert calls[-1][0] == "crm-mail-create"
          assert calls[-1][2]["recipient_email"] == ""
          assert calls[-1][2]["opportunity_id"] == "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee"
          window.crm_draft_dialog.reject()

          draft_call = next(x for x in calls if x[0] == "crm-mail-drafts")
          draft_call[3]({
              "available": True, "more": False,
              "items": [{
                  "id": "dddddddd-bbbb-4ccc-8ddd-eeeeeeeeeeee",
                  "opportunity_id": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee",
                  "company_name_at_creation": "Synthetic Research Co.",
                  "recipient_email": None, "subject": "Synthetic proposal draft",
                  "revision": 1, "updated_at": "2026-11-05"
              }]
          }, None)
          assert window.crm_draft_table.rowCount() == 1
          window.crm_draft_table.selectRow(0)
          assert window.crm_edit_draft.isEnabled()
          window.open_selected_draft()
          assert calls[-1][0] == "crm-mail-draft"
          assert calls[-1][1] == "dddddddd-bbbb-4ccc-8ddd-eeeeeeeeeeee"
          calls[-1][3]({
              "available": True,
              "draft": {
                  "id": "dddddddd-bbbb-4ccc-8ddd-eeeeeeeeeeee",
                  "opportunity_id": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee",
                  "company_name_at_creation": "Synthetic Research Co.",
                  "recipient_email": None, "subject": "Synthetic proposal draft",
                  "body_text": "Hello, this is a local draft.",
                  "revision": 1
              }
          }, None)
          assert window.crm_draft_dialog.isVisible()
          assert window.crm_mail_body.toPlainText().startswith("Hello")
          window.crm_mail_body.setPlainText("Updated locally, still not sent.")
          window.save_mail_draft()
          assert calls[-1][0] == "crm-mail-update"
          assert calls[-1][2]["expected_revision"] == 1
          window.crm_draft_dialog.reject()

          window.open_followup_update()
          assert window.crm_followup_dialog.isVisible()
          assert window.crm_followup_stage.isEnabled()
          assert window.crm_followup_has_date.isChecked()
          window.crm_followup_stage.setCurrentIndex(
              window.crm_followup_stage.findData("qualified")
          )
          window.crm_followup_action.setPlainText("Prepare an approved outreach draft")
          window.save_followup()
          assert calls[-1][0] == "crm-update-opportunity"
          assert calls[-1][2]["expected_version"] == 1
          assert calls[-1][2]["stage"] == "qualified"
          window.crm_followup_dialog.reject()
          window.navigation.setCurrentRow(1)
          assert window.pages.currentIndex() == 1
          ticket_id = "1111111a-2222-4333-8444-555555555555"
          window.current_id = ticket_id
          window.current_ticket = {
              "target_kind": "git", "target_reference": "/tmp/agent",
              "linked_project_id": "prj_test", "linked_assessment_id": "asm_test",
          }
          window.inspect_engine()
          assert calls[-1][0] == "master"
          assert calls[-1][1] == ticket_id
          calls[-1][3]({
              "available": True, "snapshot_status": "current",
              "target_sha": "a" * 40, "snapshot_id": "sys_test",
          }, None)
          assert calls[-1][0] == "operator-state"
          assert calls[-1][2]["assessment_id"] == "asm_test"
          assert calls[-1][2]["target_sha"] == "a" * 40
          calls[-1][3]({
              "available": True, "project_id": "prj_test",
              "assessment_id": "asm_test", "snapshot_id": "sys_test",
              "target_sha": "a" * 40, "environment": "test",
              "evidence_state": "not_inspected", "control_outcomes": "not_inspected",
              "security_verdict": "not_assessed", "readiness_decision": "not_evaluated",
              "notice": "No test or verdict.",
          }, None)
          assert "not_assessed" in window.engine_view.toPlainText()
          window.inspect_evidence()
          assert calls[-1][0] == "master"
          calls[-1][3]({
              "available": True, "snapshot_status": "current",
              "target_sha": "a" * 40, "snapshot_id": "sys_test",
          }, None)
