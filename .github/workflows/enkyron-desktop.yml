          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libxkbcommon0 poppler-utils
      - name: Install isolated Qt runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/enkyron-venv"
