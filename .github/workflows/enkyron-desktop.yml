              window.crm_tax_mode.findData("human_led_advisory")
          )
          window.crm_tax_business_evidence.setPlainText(
              "Synthetic verified corporate registration evidence."
          )
          window.crm_tax_location_evidence.setPlainText(
              "Synthetic buyer office location documented in France."
          )
          window.crm_tax_notes.setPlainText(
              "Confirm tax treatment and any French reverse-charge or local rules with a specialist."
          )
          window.crm_tax_source.setText("HMRC")
          window.crm_tax_confirm.setChecked(True)
          window.save_proposal_tax_review()
          assert calls[-1][0] == "crm-tax-record"
          assert calls[-1][2]["proposal_id"] == "bbbbbbbb-bbbb-4ccc-8ddd-eeeeeeeeeeee"
          assert calls[-1][2]["expected_revision"] == 1
          assert calls[-1][2]["buyer_type"] == "business"
          assert calls[-1][2]["buyer_country"] == "FR"
          assert calls[-1][2]["source_reference"] == "HMRC"
          assert calls[-1][2]["service_mode"] == "human_led_advisory"
          assert calls[-1][2]["uk_vat_registration"] == "unknown"
          assert "vat_rate" not in calls[-1][2]
          window.crm_tax_dialog.reject()
          window.open_selected_proposal()
          assert calls[-1][0] == "crm-proposal"
          calls[-1][3]({
              "available": True,
              "proposal": {
                  "id": "bbbbbbbb-bbbb-4ccc-8ddd-eeeeeeeeeeee",
                  "opportunity_id": "aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee",
                  "company_name_at_creation": "Synthetic Research Co.",
