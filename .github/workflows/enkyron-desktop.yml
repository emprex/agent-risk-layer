name: ENKYRON Desktop

on:
  push:
    branches:
      - 'feat/enkyron-desktop-*'
  pull_request:
    paths:
      - 'desktop/enkyron*'
      - 'tests/enkyron-desktop.test.js'
      - 'tests/qt_enkyron_pilot_lab_smoke.py'
      - 'tests/enkyron-pilot-lab-handoff.test.js'
      - '.github/workflows/enkyron-desktop.yml'

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Node dependencies
        run: npm ci --ignore-scripts
      - name: ENK-03 isolated PostgreSQL routing and bootstrap guard (synthetic offline)
        run: |
          node --check scripts/enkyron-enk03-uat-bootstrap.mjs
          node --test tests/enkyron-uat-database.test.js
      - name: ENK-05 Service Desk isolated UAT-04 gate (no DB writes)
        run: |
          node --check scripts/enkyron-enk05-uat-bootstrap.mjs
          node --test tests/enkyron-enk05-uat-database.test.js
          node --check scripts/enkyron-enk05-uat-preflight.mjs
          node --test tests/enkyron-enk05-uat-preflight.test.js
