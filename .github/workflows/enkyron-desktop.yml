          assert window.crm_quote_dialog.isVisible()
          assert window.crm_quote_table.rowCount() == 1
          assert window.crm_quote_table.item(0, 0).text() == "Synthetic ARL proposal"
          assert window.crm_quote_table.item(0, 1).text() == "1"
          assert window.crm_quote_table.item(0, 2).text() == "1300.75"
          assert window.crm_quote_table.item(0, 3).text() == "1300.75"
          assert "1300.75" in window.crm_quote_total.text()
          assert window.crm_quote_save.isEnabled()
          # Select a current catalog fiche. This is only an editable draft row;
          # server verification and snapshot provenance are separately tested.
          window.open_quote_catalog_picker()
          assert window.crm_quote_picker_dialog.isVisible()
          assert calls[-1][0] == "crm-service-catalog-list"
          calls[-1][3]({
              "available": True, "items": [synthetic_service], "more": False
          }, None)
          assert window.crm_quote_picker_combo.count() == 1
          assert window.crm_quote_picker_price.text() == "900.00"
          assert window.crm_quote_picker_price.isReadOnly()
          window.insert_quote_catalog_service()
          assert window.crm_quote_table.rowCount() == 2
          assert window.crm_quote_table.item(1, 0).text() == (
              "ARL-CI-REVIEW — Synthetic agent security review"
          )
          assert window.crm_quote_table.item(1, 0).data(
              Qt.ItemDataRole.UserRole
          )["source_catalog_revision"] == 1
          assert "2200.75" in window.crm_quote_total.text()
          window.crm_quote_table.selectRow(1)
          window.remove_quote_line()
          assert window.crm_quote_table.rowCount() == 1
          # The suggested line is editable and can be replaced with a deliberate
          # multi-line operator breakdown; it has NOT been persisted on open.
          window.crm_quote_table.selectRow(0)
          window.remove_quote_line()
          window.add_quote_line("Bounded manual tool review", "2", "125.50")
          window.add_quote_line("Report and human validation", "1", "50.25")
          assert window.crm_quote_table.rowCount() == 2
          assert "301.25" in window.crm_quote_total.text()
          assert window.crm_quote_table.item(0, 3).text() == "251.00"
          assert window.crm_quote_save.isEnabled()
          window.save_quote_lines()
          assert calls[-1][0] == "crm-proposal-lines-save"
          assert calls[-1][2]["expected_revision"] == 2
          assert calls[-1][2]["lines"][0]["quantity"] == 2
          assert calls[-1][2]["lines"][0]["unit_price_minor"] == 12550
          assert calls[-1][2]["lines"][1]["unit_price_minor"] == 5025
          window.crm_quote_dialog.reject()

          # Opening a previously itemized proposal must retain the saved lines,
          # and must not invent an additional fee line.
          window.show_quote_lines_dialog({
              "available": True, "id": "bbbbbbbb-bbbb-4ccc-8ddd-eeeeeeeeeeee",
              "revision": 3, "title": "Synthetic ARL proposal",
              "currency": "GBP", "amount_minor": 30125,
