name: ENKYRON Desktop

on:
  push:
    branches:
      - 'feat/enkyron-desktop-*'
  pull_request:
    paths:
      - 'desktop/enkyron*'
      - 'tests/enkyron-desktop.test.js'
      - '.github/workflows/enkyron-desktop.yml'

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Node dependencies
        run: npm ci --ignore-scripts
      - name: Desktop bridge and contract tests
        run: |
          node --check desktop/enkyron-contract.mjs
          node --check desktop/enkyron-bridge.mjs
          node --check desktop/enkyron-evidence-register.mjs
          node --test tests/enkyron-desktop.test.js tests/enkyron-evidence-register.test.js
          python3 -B -m unittest desktop.test_assessment_bridge desktop.test_enkyron_operator_state desktop.test_enkyron_evidence
      - name: Install native Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libopengl0 libxkbcommon0
      - name: Install isolated Qt runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/enkyron-venv"
          "$RUNNER_TEMP/enkyron-venv/bin/python" -m pip install --disable-pip-version-check "PySide6_Essentials>=6.9,<7"
      - name: Native window smoke without PostgreSQL
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/enkyron-venv/bin/python" - <<'PY'
          from PySide6.QtWidgets import QApplication, QMainWindow
          from desktop.enkyron import DesktopBridge, EnkyronWindow

          # Verify Qt widget construction without connecting to a DB or running ARL.
          DesktopBridge.call = lambda *_args, **_kwargs: None
          app = QApplication([])
          window = EnkyronWindow()
          assert isinstance(window, QMainWindow)
          assert window.tabs.count() == 7
          assert window.tabs.tabText(4) == 'ARL Engine'
          assert window.tabs.tabText(5) == 'Evidence Requests'
          assert window.tabs.tabText(6) == 'Evidence Register'
          assert window.windowTitle().startswith("ENKYRON")
          # Exercise the real Qt callback path using a stubbed local IPC process.
          calls = []
          def fake_call(_self, action, arg="", payload=None, callback=None):
              calls.append((action, arg, payload, callback))
          DesktopBridge.call = fake_call
          ticket_id = "1111111a-2222-4333-8444-555555555555"
          window.current_id = ticket_id
          window.current_ticket = {
              "target_kind": "git", "target_reference": "/tmp/agent",
              "linked_project_id": "prj_test", "linked_assessment_id": "asm_test",
          }
          window.inspect_engine()
          assert calls[-1][0] == "master"
          assert calls[-1][1] == ticket_id
          calls[-1][3]({
              "available": True, "snapshot_status": "current",
              "target_sha": "a" * 40, "snapshot_id": "sys_test",
          }, None)
          assert calls[-1][0] == "operator-state"
          assert calls[-1][2]["assessment_id"] == "asm_test"
          assert calls[-1][2]["target_sha"] == "a" * 40
          calls[-1][3]({
              "available": True, "project_id": "prj_test",
              "assessment_id": "asm_test", "snapshot_id": "sys_test",
              "target_sha": "a" * 40, "environment": "test",
              "evidence_state": "not_inspected", "control_outcomes": "not_inspected",
              "security_verdict": "not_assessed", "readiness_decision": "not_evaluated",
              "notice": "No test or verdict.",
          }, None)
          assert "not_assessed" in window.engine_view.toPlainText()
          window.inspect_evidence()
          assert calls[-1][0] == "master"
          calls[-1][3]({
              "available": True, "snapshot_status": "current",
              "target_sha": "a" * 40, "snapshot_id": "sys_test",
          }, None)
          assert calls[-1][0] == "evidence-summary"
          assert calls[-1][2]["snapshot_id"] == "sys_test"
          calls[-1][3]({
              "available": True, "kind": "summary",
              "assessment_controls": 99, "other_workflow_controls": 9,
              "criterion_count": 208,
              "counts": {
                  "staticCandidates": 1, "staticMissing": 2,
                  "humanRequirements": 3, "runtimeRequirements": 4,
                  "sourceLineageIssues": 5,
              },
              "packs": [{
                  "number": 1, "category": "manual_review",
                  "requirement_instances": 2, "affected_controls": 2
              }],
          }, None)
          assert "ARL CONTROL REGISTER: 108" in window.evidence_summary.toPlainText()
          assert window.evidence_packs.count() == 1
          window.open_evidence_pack()
          assert calls[-1][0] == "evidence-pack"
          assert calls[-1][2]["pack_number"] == 1
          calls[-1][3]({
              "available": True, "kind": "pack", "pack_number": 1,
              "page_number": 1, "page_count": 1, "task_count": 1,
              "tasks": [{
                  "control_id": "ARL-KB-013", "requirement_index": 1,
                  "review_state": "manual_triage_required",
                  "candidate_count": 0, "expected_collectors": [],
                  "requirement": "Document approved egress destinations",
              }],
          }, None)
          assert "ARL-KB-013" in window.evidence_details.toPlainText()
          assert not window.evidence_next.isEnabled()
          window.inspect_records()
          assert calls[-1][0] == "evidence-register"
          assert calls[-1][2] == {
              "ticket_id": ticket_id, "control_id": "ARL-KB-013"
          }
          calls[-1][3]({
              "available": True, "control_id": "ARL-KB-013",
              "integrity": "master_verified", "snapshot_id": "sys_test",
              "more": False,
              "items": [{
                  "id": "ev_1", "entry_id": "ARL-KB-013",
                  "snapshot_id": "sys_test", "verification_state": "unverified",
                  "retention_status": "active", "evidence_class": "observed",
                  "source_type": "runtime_log", "observed_at": "2026-11-05",
                  "created_at": "2026-11-05", "test_execution_id": "test_1",
                  "runtime_event_id": None, "approval_id": None,
                  "recorded_integrity_digest": "b" * 64,
              }],
              "tests": [{
                  "id": "test_1", "entry_id": "ARL-KB-013",
                  "snapshot_id": "sys_test", "execution_kind": "initial",
                  "recorded_result": "passed",
                  "started_at": "2026-11-05", "completed_at": "2026-11-05",
                  "retest_of_execution_id": None, "original_snapshot_id": None,
                  "finding_id": None, "remediation_id": None,
                  "recorded_content_digest": "c" * 64,
              }],
              "more_tests": False,
          }, None)
          assert window.records_table.rowCount() == 1
          assert window.records_table.item(0, 1).text() == "unverified"
          assert "not recomputed" in window.record_details.toPlainText()
          assert window.tests_table.rowCount() == 1
          assert window.record_views.tabText(1) == "Test history (1)"
          window.record_views.setCurrentIndex(1)
          window.tests_table.selectRow(0)
          assert "Recorded test result: passed" in window.record_details.toPlainText()
          assert "NOT a control PASS" in window.record_details.toPlainText()
          window.record_control.setValue(14)
          assert window.records_table.rowCount() == 0
          assert window.tests_table.rowCount() == 0
          window.close()
          app.quit()
          PY
