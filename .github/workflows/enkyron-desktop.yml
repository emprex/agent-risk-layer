          assert window.crm_proposal_price.text() == "1250.50"
          window.crm_proposal_price.setText("1300.75")
          window.save_proposal()
          assert calls[-1][0] == "crm-proposal-update"
          assert calls[-1][2]["expected_revision"] == 1
          assert calls[-1][2]["amount_minor"] == 130075
          window.crm_proposal_dialog.reject()

          # Itemized quote editor reuses the saved draft, no new customer or send.
          assert window.crm_edit_lines.isEnabled()
          window.open_selected_quote_lines()
          assert calls[-1][0] == "crm-proposal-lines"
          assert calls[-1][1] == "bbbbbbbb-bbbb-4ccc-8ddd-eeeeeeeeeeee"
          calls[-1][3]({
              "available": True, "id": "bbbbbbbb-bbbb-4ccc-8ddd-eeeeeeeeeeee",
              "revision": 2, "title": "Synthetic ARL proposal",
              "currency": "GBP", "amount_minor": 130075,
              "uses_lines": False, "lines": []
