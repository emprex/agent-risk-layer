name: One-off validation copy fix

on:
  push:
    branches:
      - journey-8-5-production-validation

permissions:
  contents: write

jobs:
  fix-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: journey-8-5-production-validation
      - name: Replace leaked scenario name and remove one-off workflow
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'public/control-plane.js';
          const from = 'Only choose an existing project when it represents this exact Northstar deployment and version.';
          const to = 'Only choose an existing project when it represents this exact agent deployment and version.';
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(from)) {
            console.error('Expected source text was not found; refusing to make a broader change.');
            process.exit(2);
          }
          const updated = source.replace(from, to);
          if ((updated.match(/Northstar deployment/gi) || []).length !== 0) {
            console.error('Northstar deployment still exists after bounded replacement.');
            process.exit(3);
          }
          fs.writeFileSync(path, updated);
          NODE
          git rm .github/workflows/one-off-validation-copy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/control-plane.js
          git diff --cached --check
          git diff --cached --exit-code --quiet && { echo 'No bounded change produced'; exit 4; } || true
          git commit -m "Fix generic remediation scope copy"
          git push origin HEAD:journey-8-5-production-validation
