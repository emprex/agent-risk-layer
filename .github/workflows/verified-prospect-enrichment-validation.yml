name: Verified prospect enrichment validation

on:
  push:
    branches:
      - fix/verified-prospect-enrichment-20260810

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Fetch exact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=5 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git switch -C "${GITHUB_REF_NAME}"

      - name: Correct evidence URLs
        working-directory: repo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('migrations/018_sales_prospect_verified_enrichment.sql')
          s = p.read_text()
          old = 'https://inference.sh/docs/connectors/agent-tools'
          assert s.count(old) == 1, 'unexpected inference.sh evidence URL state'
          s = s.replace(old, 'https://inference.sh/docs/agents/adding-tools","https://inference.sh/docs/connectors/mcp-server')
          old = 'https://registry.modelcontextprotocol.io/v0/servers?search=ai.radiusos'
          assert s.count(old) == 1, 'unexpected RadiusOS registry URL state'
          s = s.replace(old, 'https://registry.modelcontextprotocol.io/v0/servers?search=ai.radiusos.www')
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: repo
        run: npm ci

      - name: Validate enrichment and sales workflow
        working-directory: repo
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/arl_test
        run: |
          node --test tests/sales-prospect-enrichment.test.js
          node --test tests/sales-agent.test.js
          git diff --check

      - name: Commit validated change and remove temporary workflow
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AgentRiskLayer automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/verified-prospect-enrichment-validation.yml
          git add migrations/018_sales_prospect_verified_enrichment.sql tests/sales-prospect-enrichment.test.js
          git commit -m "Enrich verified sales prospects"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
