name: Verify owner assessment production
on:
  push:
    branches: [fix/owner-assessment-cases-20260810]
permissions:
  contents: write
jobs:
  verify-production:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify production readiness and schema
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://agentrisklayer.com/api/ready | tee ready.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('ready.json','utf8'));
          if (data.ok !== true) throw new Error(`Production not ready: ${JSON.stringify(data)}`);
          if (data.database?.adapter !== 'postgres') throw new Error(`Expected postgres: ${JSON.stringify(data.database)}`);
          if (data.database?.schemaCurrent !== true) throw new Error(`Schema not current: ${JSON.stringify(data.database)}`);
          if (data.database?.latestMigration !== '019_owner_assessment_cases.sql') throw new Error(`Unexpected latest migration: ${JSON.stringify(data.database)}`);
          if (Number(data.database?.migrationCount) !== 19) throw new Error(`Unexpected migration count: ${JSON.stringify(data.database)}`);
          console.log('PRODUCTION_SCHEMA_OK', JSON.stringify(data.database));
          NODE
      - name: Verify deployed owner assessment UI asset
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://agentrisklayer.com/control-plane.js -o control-plane.js
          grep -F "Owner-only assessment workspace" control-plane.js
          grep -F "projectKind: 'assessment_case'" control-plane.js
          grep -F "cannot issue runtime keys, runtime approvals or protection quota" control-plane.js
          echo PRODUCTION_OWNER_ASSESSMENT_UI_OK
      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git switch -C "${GITHUB_REF_NAME}"
          git config user.name "AgentRiskLayer automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/verify-owner-assessment-production.yml
          git commit -m "Remove temporary owner assessment production verification"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
