name: Control Intelligence remediation snapshot continuity validation

on:
  push:
    branches:
      - fix/control-intelligence-remediation-snapshot-continuity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentrisk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentrisk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Initialize PostgreSQL schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentrisk_test
        run: node --input-type=module -e "import { initialiseDatabase } from './src/db.js'; await initialiseDatabase();"
      - name: Run focused Control Intelligence tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentrisk_test
        run: node --test tests/control-intelligence-historical-failure.test.js tests/control-intelligence-historical-project-gates.test.js tests/control-intelligence-historical-ui.test.js tests/control-intelligence-failure-handoff.test.js tests/control-intelligence-evidence-semantics.test.js tests/control-intelligence-ux.test.js
      - name: Run full test suite with the supported test adapter
        run: npm test
