name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: npm run check

      - name: Focused Fix → Prove regressions
        run: >-
          node --test
          tests/fix-prove-evidence.test.js
          tests/repository-scope-consistency.test.js
          tests/dependency-count-semantics.test.js
          tests/dependency-vulnerability-evidence.test.js

      - name: Unit and integration tests
        id: unit-tests
        shell: bash
        run: |
          set -o pipefail
          timeout 120s npm test 2>&1 | tee unit-test.log

      - name: Upload unit-test log on failure
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-log
          path: unit-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Generate synthetic offline operator dashboard
        run: npm run demo:operator -- "$RUNNER_TEMP/arl-operator-demo"

      - name: Upload synthetic offline operator dashboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arl-operator-dashboard-synthetic-demo
          path: ${{ runner.temp }}/arl-operator-demo/*.html
          if-no-files-found: error
          retention-days: 7

      - name: Scenario regression
        run: npm run test:scenarios

      - name: Detection regression
        run: npm run test:detection-benchmark

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arl_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: arl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arl_ci -d arl_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Real PostgreSQL migration and synthetic Operator acceptance
        env:
          CI: 'true'
          ARL_CI_POSTGRES_URL: postgresql://arl_ci:synthetic-ci-only@127.0.0.1:5432/arl_ci
        run: node --test tests/postgres-ci-integration.test.js
