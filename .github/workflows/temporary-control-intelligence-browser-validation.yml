name: Temporary Control Intelligence browser validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arl
          POSTGRES_PASSWORD: arl_test_password
          POSTGRES_DB: arl_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U arl -d arl_disposable_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static and focused validation
        run: |
          npm run check
          node --test tests/control-intelligence-ux.test.js
      - name: Full regression suite
        run: npm test
      - name: Disposable PostgreSQL Control Intelligence validation
        env:
          TEST_DATABASE_URL: postgresql://arl:arl_test_password@127.0.0.1:5432/arl_disposable_test
        run: npm run test:control-intelligence-postgres
      - name: Start test server
        run: |
          rm -f ./data/browser-validation.sqlite ./data/browser-validation.sqlite-shm ./data/browser-validation.sqlite-wal
          NODE_ENV=test PORT=3311 HOST=127.0.0.1 BASE_URL=http://127.0.0.1:3311 DEMO_MODE=true SESSION_SECRET=browser-test-secret-12345678901234567890 DATABASE_PATH=./data/browser-validation.sqlite ADMIN_EMAIL=browser-owner@example.test SUPPORT_EMAIL=support@example.test node server.js > /tmp/arl-server.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3311/api/health >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/arl-server.log
          exit 1
      - name: Start headless Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --user-data-dir=/tmp/arl-chrome about:blank > /tmp/chrome.log 2>&1 &
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:9223/json/list >/dev/null; then exit 0; fi
            sleep .25
          done
          cat /tmp/chrome.log
          exit 1
      - name: Prepare temporary browser journey
        run: |
          sed -i '/await wait('\''document.body.innerText.includes("Create a finding")'\'');/d' scripts/verify-control-intelligence-ux-browser.mjs
          node scripts/check-browser-validator.mjs scripts/verify-control-intelligence-ux-browser.mjs
      - name: Run authenticated visible UX workflow
        env:
          BROWSER_BASE_URL: http://127.0.0.1:3311
          CDP_LIST_URL: http://127.0.0.1:9223/json/list
        run: node scripts/verify-control-intelligence-ux-browser.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/arl-server.log || true
