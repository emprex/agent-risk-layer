name: Workspace real refactor validation

on:
  push:
    branches:
      - fix/authenticated-workspace-real-refactor-20260814

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: JavaScript syntax
        run: npm run check
      - name: Workspace contracts
        run: node --test tests/commercial-workspace-ux.test.js tests/workspace-architecture-v2.test.js tests/flagship-art-direction.test.js tests/experience-design.test.js
      - name: Browser layout acceptance
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const css = [
            fs.readFileSync('public/styles.css', 'utf8'),
            fs.readFileSync('public/security-workspace.css', 'utf8'),
            fs.readFileSync('public/workspace-app.css', 'utf8'),
          ].join('\n');
          const shell = `
            <header class="site-header site-header-v10 app-header-v10" data-site-header>
              <a class="brand brand-v10"><span class="brand-mark">AR</span><span><strong>AgentRiskLayer</strong><small>Security workspace</small></span></a>
              <nav class="primary-navigation" data-primary-navigation>
                <a aria-current="page">Overview</a><a>Assess</a><a>Findings</a><a>Evidence</a><a>Runtime</a><a>Settings</a><a class="workspace-help-nav">Help</a>
              </nav>
            </header>`;
          const dashboard = `
            <main class="app-shell wide">
              <header class="workspace-page-header"><div><span class="eyebrow">Overview</span><h1>AI agent security</h1><p>Select an agent, read its current posture, then take the one action that most improves deployment evidence.</p></div></header>
              <section class="workspace-agent-command">
                <div class="workspace-agent-command-head"><div class="workspace-agent-identity"><span class="eyebrow">Current agent</span><h2>CLARA</h2><p>Autonomous assistant · Current assessment</p></div></div>
                <div class="workspace-status-grid">
                  <article class="workspace-status-card" data-state="unresolved"><span class="eyebrow">Deployment decision</span><strong>No decision recorded</strong><p>Deployment evidence has not produced a server-recorded decision yet.</p></article>
                  <article class="workspace-status-card" data-state="critical"><span class="eyebrow">Latest assessment</span><strong>High declared risk</strong><p>Supporting context from the latest declared assessment.</p></article>
                  <aside class="workspace-next-action"><span class="eyebrow">Next action</span><strong>Review the highest-priority finding</strong><p>Fix the blocker, attach evidence and retest the exact control.</p><a class="button primary">Open finding</a></aside>
                </div>
              </section>
              <section class="workspace-section"><h2>Why this is the current view</h2><div class="workspace-signal-grid"><div class="workspace-signal"><strong>17</strong><span>Findings</span></div><div class="workspace-signal"><strong>4</strong><span>Evidence gaps</span></div><div class="workspace-signal"><strong>0</strong><span>Retests passed</span></div></div></section>
            </main>`;
          const runtime = `
            <main class="app-shell wide"><header class="page-heading app-page-heading"><div><span class="eyebrow">Runtime & fixes</span><h1>Runtime and remediation</h1><p>Work on the selected agent.</p></div></header>
              <div class="guided-control-layout"><section class="customer-control-home">
                <article class="guided-progress-v10"><h2>Step 4 of 4</h2><p>Protection journey</p></article>
                <article class="owner-assessment-cases"><h2>Owner-only assessment workspace</h2><p>Assessment cases</p></article>
                <article class="human-next-card"><span class="eyebrow">Next action</span><h2>Run the safe protection check</h2><p>Verify the current runtime policy before integrating a real action.</p></article>
                <article class="plain-activity"><h2>Recent decisions</h2><p>No misleading default status.</p></article>
                <div class="v10-control-choices"><article><h3>Protect a live action</h3></article></div>
                <p class="v10-specialist-note">Specialist controls remain available when needed.</p>
              </section><div class="guided-plan-summary"><strong>Community</strong><span>1 active project</span><span>10,000 decisions/month</span></div></div>
            </main>`;
          const result = `
            <main class="app-shell wide"><header class="result-agent-header"><span class="eyebrow">Assessment result</span><h1>CLARA</h1><p>Current declared assessment posture.</p></header>
              <section class="result-decision-card"><span class="eyebrow">Current assessment posture</span><h2>High declared risk</h2><div class="result-reason-grid"><div><strong>Why</strong><p>Confirmed findings need remediation.</p></div><div><strong>Proof</strong><p>Observed evidence is incomplete.</p></div></div><div class="result-next-action"><strong>Next action</strong><p>Fix the highest-priority finding and retest it.</p><a class="button primary">Open finding</a></div></section>
            </main>`;
          const browser = await chromium.launch({headless:true});
          async function inspect(name, body, viewport) {
            const page = await browser.newPage({ viewport });
            await page.setContent(`<style>${css}</style><body data-shell="app">${shell}${body}</body>`);
            const state = await page.evaluate(() => {
              const header = document.querySelector('.site-header');
              const nav = document.querySelector('.primary-navigation');
              const grid = document.querySelector('.workspace-status-grid');
              const next = document.querySelector('.human-next-card');
              const owner = document.querySelector('.owner-assessment-cases');
              const plan = document.querySelector('.guided-plan-summary');
              return {
                bodyPaddingLeft: getComputedStyle(document.body).paddingLeft,
                headerPosition: getComputedStyle(header).position,
                headerWidth: header.getBoundingClientRect().width,
                navDirection: getComputedStyle(nav).flexDirection,
                gridColumns: grid ? getComputedStyle(grid).gridTemplateColumns : '',
                bodyOverflow: document.documentElement.scrollWidth - document.documentElement.clientWidth,
                nextOrder: next ? Number(getComputedStyle(next).order) : null,
                ownerOrder: owner ? Number(getComputedStyle(owner).order) : null,
                planDirection: plan ? getComputedStyle(plan).flexDirection : null,
                bodyBackgroundImage: getComputedStyle(document.body).backgroundImage,
              };
            });
            console.log(name, state);
            if (state.bodyOverflow > 1) throw new Error(`${name}: horizontal overflow ${state.bodyOverflow}px`);
            if (state.bodyBackgroundImage !== 'none') throw new Error(`${name}: authenticated body still has promotional background imagery`);
            if (viewport.width >= 961) {
              if (parseFloat(state.bodyPaddingLeft) < 200) throw new Error(`${name}: no persistent desktop app rail`);
              if (state.headerPosition !== 'fixed') throw new Error(`${name}: desktop rail is not fixed`);
              if (state.headerWidth < 210 || state.headerWidth > 240) throw new Error(`${name}: unexpected desktop rail width ${state.headerWidth}`);
              if (state.navDirection !== 'column') throw new Error(`${name}: desktop navigation is not vertical`);
              if (state.gridColumns && state.gridColumns.trim().split(/\s+/).length < 2) throw new Error(`${name}: desktop status hierarchy collapsed unexpectedly`);
            } else {
              if (parseFloat(state.bodyPaddingLeft) !== 0) throw new Error(`${name}: mobile retained desktop rail padding`);
              if (state.headerPosition !== 'sticky') throw new Error(`${name}: mobile shell should use sticky header`);
              if (state.gridColumns && state.gridColumns.trim().split(/\s+/).length !== 1) throw new Error(`${name}: mobile status hierarchy is not single-column`);
            }
            if (state.nextOrder !== null && state.ownerOrder !== null && !(state.nextOrder < state.ownerOrder)) throw new Error(`${name}: owner workflow still precedes customer next action`);
            if (state.planDirection !== null && state.planDirection !== 'column') throw new Error(`${name}: plan metadata still runs together horizontally`);
            await page.screenshot({ path: `workspace-${name}-${viewport.width}.png`, fullPage: true });
            await page.close();
          }
          await inspect('dashboard', dashboard, {width:1440,height:1000});
          await inspect('runtime', runtime, {width:1440,height:1000});
          await inspect('result', result, {width:1440,height:1000});
          await inspect('dashboard-mobile', dashboard, {width:390,height:844});
          await inspect('runtime-mobile', runtime, {width:390,height:844});
          await browser.close();
          EOF
      - name: Full regression suite
        run: npm test
