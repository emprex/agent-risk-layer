name: Customer journey UX validation

on:
  push:
    branches:
      - fix/customer-journey-ux-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install disposable browser verifier
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Isolate mobile overflow in Chromium
        run: |
          python3 -m http.server 4173 -d public >/tmp/arl-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
            for (const path of ['/demo.html', '/trust.html']) {
              const page = await context.newPage();
              await page.goto(`http://127.0.0.1:4173${path}`, { waitUntil: 'domcontentloaded' });
              const data = await page.evaluate(() => {
                const measure = () => document.documentElement.scrollWidth;
                const main = document.querySelector('main');
                const baseline = { viewport: innerWidth, html: measure(), body: document.body.scrollWidth, main: main?.scrollWidth || null };
                const describe = (element) => {
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return {
                    tag: element.tagName.toLowerCase(),
                    id: element.id || '',
                    className: typeof element.className === 'string' ? element.className : '',
                    rect: { left: rect.left, right: rect.right, width: rect.width },
                    scrollWidth: element.scrollWidth,
                    clientWidth: element.clientWidth,
                    overflowX: style.overflowX,
                    display: style.display,
                    gridTemplateColumns: style.gridTemplateColumns,
                    minWidth: style.minWidth,
                  };
                };
                const hideChecks = [];
                for (const element of [...main.children]) {
                  const before = describe(element);
                  const oldDisplay = element.style.display;
                  element.style.display = 'none';
                  const afterHide = measure();
                  element.style.display = oldDisplay;
                  const oldOverflow = element.style.overflowX;
                  element.style.overflowX = 'hidden';
                  const afterClip = measure();
                  element.style.overflowX = oldOverflow;
                  hideChecks.push({ before, afterHide, afterClip });
                }
                const descendants = [...main.querySelectorAll('*')]
                  .map(describe)
                  .filter((item) => item.scrollWidth > item.clientWidth + 1 || item.rect.right > innerWidth + 1 || item.rect.left < -1)
                  .slice(0, 50);
                return { baseline, hideChecks, descendants };
              });
              console.log(path, JSON.stringify(data));
              await page.close();
            }
            await context.close();
          } finally {
            await browser.close();
          }
          NODE
