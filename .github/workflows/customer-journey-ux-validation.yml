name: Customer journey UX validation

on:
  push:
    branches:
      - fix/customer-journey-ux-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Focused journey tests
        run: node --test tests/customer-journey-ux.test.js

      - name: Full regression suite
        run: npm test

      - name: Install disposable browser verifier
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify repaired layouts in Chromium
        run: |
          python3 -m http.server 4173 -d public >/tmp/arl-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          try {
            const desktop = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const assessment = await desktop.newPage();
            await assessment.goto('http://127.0.0.1:4173/assessment.html', { waitUntil: 'domcontentloaded' });
            for (const selector of ['#revisionReviewField', '#backButton', '#submitAssessment']) {
              const state = await assessment.locator(selector).evaluate((element) => ({
                hidden: element.hidden,
                display: getComputedStyle(element).display,
                width: element.getBoundingClientRect().width,
                height: element.getBoundingClientRect().height,
              }));
              assert.equal(state.hidden, true, `${selector} should retain the hidden property`);
              assert.equal(state.display, 'none', `${selector} should compute to display:none`);
              assert.equal(state.width, 0, `${selector} should have no visible width`);
              assert.equal(state.height, 0, `${selector} should have no visible height`);
            }
            await desktop.close();

            const mobile = await browser.newContext({ viewport: { width: 390, height: 844 } });
            for (const path of ['/demo.html', '/trust.html']) {
              const page = await mobile.newPage();
              await page.goto(`http://127.0.0.1:4173${path}`, { waitUntil: 'domcontentloaded' });
              const layout = await page.evaluate(() => {
                const viewport = window.innerWidth;
                const offenders = [...document.querySelectorAll('body *')].map((element) => {
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return {
                    tag: element.tagName.toLowerCase(),
                    id: element.id || '',
                    className: typeof element.className === 'string' ? element.className : '',
                    left: Math.round(rect.left * 10) / 10,
                    right: Math.round(rect.right * 10) / 10,
                    width: Math.round(rect.width * 10) / 10,
                    display: style.display,
                    minWidth: style.minWidth,
                    gridTemplateColumns: style.gridTemplateColumns,
                    overflowX: style.overflowX,
                    text: String(element.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 80),
                  };
                }).filter((item) => item.display !== 'none' && item.width > 0 && (item.right > viewport + 1 || item.left < -1)).slice(0, 20);
                return { viewport, html: document.documentElement.scrollWidth, body: document.body.scrollWidth, offenders };
              });
              console.log(path, JSON.stringify(layout));
              assert.ok(layout.html <= layout.viewport + 1, `${path} html overflows: ${JSON.stringify(layout)}`);
              assert.ok(layout.body <= layout.viewport + 1, `${path} body overflows: ${JSON.stringify(layout)}`);
              await page.close();
            }
            await mobile.close();
          } finally {
            await browser.close();
          }
          console.log('Chromium customer-journey UX verification passed.');
          NODE
