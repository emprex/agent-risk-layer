name: Validate closure fix
on:
  push:
    branches: [fix/verified-closure-progression]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: node --test tests/control-intelligence-journey.test.js
      - run: npm test
