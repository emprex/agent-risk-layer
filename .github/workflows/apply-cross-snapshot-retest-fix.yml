name: Apply cross-snapshot retest repair

on:
  push:
    branches:
      - fix/cross-snapshot-retest-20260811

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cross-snapshot-retest-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply bounded repair
        run: |
          python3 scripts/apply-cross-snapshot-retest-fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-control-intelligence-browser.mjs')
          source = path.read_text()
          replacement = "await wait('Boolean(document.querySelector(\".ci-stage-nav li[data-state=current] button\"))');"
          cursor = 0
          while True:
              start = source.find("await wait('document.querySelector(", cursor)
              if start < 0:
                  break
              end = source.find("');", start)
              if end < 0:
                  break
              end += 3
              segment = source[start:end]
              if 'dataset.uxState' in segment and any(stage in segment for stage in ['finding','remediation','retest','approval','deployment_decision']):
                  source = source[:start] + replacement + source[end:]
                  cursor = start + len(replacement)
              else:
                  cursor = end
          controls_prefix = 'await navigate(`/control-intelligence.html?projectId=${encodeURIComponent(projectId)}&view=controls`);'
          controls_bad = "await wait('Boolean(document.querySelector(\"#controls\")) && document.body.innerText.includes(\"0 of 108 controls reviewed\")');"
          controls_good = "await wait('document.body.innerText.includes(\"Review suggested controls\")');"
          marker = controls_prefix + controls_bad
          if marker in source:
              source = source.replace(marker, controls_prefix + controls_good, 1)
          closure_bad = "await wait('Boolean(document.querySelector(\"#retestForm\"))');await type('#closureLimitations'"
          closure_good = "await wait('Boolean(document.querySelector(\"#closureForm\"))');await type('#closureLimitations'"
          if closure_bad in source:
              source = source.replace(closure_bad, closure_good, 1)
          path.write_text(source)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Focused workflow tests
        run: node --test tests/control-intelligence-ux.test.js
      - name: Full regression suite
        run: npm test
      - name: Commit intended repair if changed
        run: |
          git config user.name "emprex"
          git config user.email "guillaume.strohecker@gmail.com"
          git add src/control-intelligence.js scripts/verify-control-intelligence-browser.mjs tests/control-intelligence-ux.test.js
          if git diff --cached --quiet; then
            echo "No intended product changes to commit."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Align browser verifier with closure stage"
          git push origin HEAD:fix/cross-snapshot-retest-20260811
