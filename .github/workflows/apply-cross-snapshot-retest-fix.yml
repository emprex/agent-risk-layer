name: Apply cross-snapshot retest repair

on:
  push:
    branches:
      - fix/cross-snapshot-retest-20260811

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cross-snapshot-retest-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply bounded source and browser-verifier repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/control-intelligence.js')
          source = path.read_text()

          marker = "derived.snapshotAssessmentConfiguration=snapshot.assessment_configuration_json;"
          if 'derived.evidenceHistory=await db.prepare' not in source:
              old = "  const derived = await loadDerivedRows(access, snapshot, allEvaluations);\n  derived.snapshotAssessmentConfiguration=snapshot.assessment_configuration_json;"
              new = "  const derived = await loadDerivedRows(access, snapshot, allEvaluations);\n  derived.testHistory=await db.prepare(`SELECT t.* FROM control_test_executions t WHERE t.workspace_id=? AND t.project_id=? AND (t.system_snapshot_id=? OR EXISTS (SELECT 1 FROM remediation_items r WHERE r.id=t.finding_id AND r.project_id=t.project_id AND r.status NOT IN ('verified_closed','accepted_risk'))) ORDER BY t.created_at DESC LIMIT 500`).all(access.project.workspace_id,access.project.id,snapshot.id);\n  derived.evidenceHistory=await db.prepare(`SELECT e.* FROM control_evidence_items e WHERE e.workspace_id=? AND e.project_id=? AND (e.system_snapshot_id=? OR EXISTS (SELECT 1 FROM control_test_executions t JOIN remediation_items r ON r.id=t.finding_id AND r.project_id=t.project_id WHERE t.id=e.test_execution_id AND r.status NOT IN ('verified_closed','accepted_risk'))) ORDER BY e.observed_at DESC LIMIT 500`).all(access.project.workspace_id,access.project.id,snapshot.id);\n  await verifyRows(derived.testHistory,'content_digest','test');await verifyRows(derived.evidenceHistory,'integrity_digest','evidence');\n  derived.snapshotAssessmentConfiguration=snapshot.assessment_configuration_json;"
              assert source.count(old) == 1, 'overview history insertion point changed'
              source = source.replace(old, new, 1)

          if 'lineageTests,lineageEvidence' not in source:
              old = "const [tests,evidence,links,remediations,runtime,approvals,decisions,mappings,revisions,requirements,testHistory] = await Promise.all(["
              new = "const [tests,evidence,links,remediations,runtime,approvals,decisions,mappings,revisions,requirements,testHistory,lineageTests,lineageEvidence] = await Promise.all(["
              assert source.count(old) == 1, 'detail history tuple changed'
              source = source.replace(old, new, 1)
              old = "    db.prepare('SELECT * FROM control_test_executions WHERE workspace_id=? AND project_id=? AND entry_id=? ORDER BY created_at DESC LIMIT ?').all(access.project.workspace_id,projectId,controlId,limit),\n  ]);"
              new = "    db.prepare('SELECT * FROM control_test_executions WHERE workspace_id=? AND project_id=? AND entry_id=? ORDER BY created_at DESC LIMIT ?').all(access.project.workspace_id,projectId,controlId,limit),\n    db.prepare(`SELECT t.* FROM control_test_executions t WHERE t.workspace_id=? AND t.project_id=? AND t.entry_id=? AND (t.system_snapshot_id=? OR EXISTS (SELECT 1 FROM remediation_items r WHERE r.id=t.finding_id AND r.project_id=t.project_id AND r.status NOT IN ('verified_closed','accepted_risk'))) ORDER BY t.created_at DESC LIMIT 250`).all(access.project.workspace_id,projectId,controlId,snapshot.id),\n    db.prepare(`SELECT e.* FROM control_evidence_items e WHERE e.workspace_id=? AND e.project_id=? AND e.entry_id=? AND (e.system_snapshot_id=? OR EXISTS (SELECT 1 FROM control_test_executions t JOIN remediation_items r ON r.id=t.finding_id AND r.project_id=t.project_id WHERE t.id=e.test_execution_id AND r.status NOT IN ('verified_closed','accepted_risk'))) ORDER BY e.observed_at DESC LIMIT 250`).all(access.project.workspace_id,projectId,controlId,snapshot.id),\n  ]);"
              assert source.count(old) == 1, 'detail history query insertion point changed'
              source = source.replace(old, new, 1)
              old = "  await verifyRows(tests, 'content_digest','test');\n  await verifyRows(evidence, 'integrity_digest','evidence');\n  await verifyRows(decisions,'decision_digest','decision');"
              new = "  await verifyRows(tests, 'content_digest','test');\n  await verifyRows(evidence, 'integrity_digest','evidence');\n  await verifyRows(testHistory, 'content_digest','test');\n  await verifyRows(lineageTests, 'content_digest','test');\n  await verifyRows(lineageEvidence, 'integrity_digest','evidence');\n  await verifyRows(decisions,'decision_digest','decision');"
              assert source.count(old) >= 1, 'detail verify block changed'
              source = source.replace(old, new, 1)
              old = "  const derived = { tests:testHistory, evidence, links, remediations, runtime, approvals, requirements:requirements.map(row=>({entry_id:controlId,...row})), decisions };"
              new = "  const derived = { tests, evidence, testHistory:lineageTests, evidenceHistory:lineageEvidence, links, remediations, runtime, approvals, requirements:requirements.map(row=>({entry_id:controlId,...row})), decisions };"
              assert source.count(old) == 1, 'detail derived block changed'
              source = source.replace(old, new, 1)

          pattern = re.compile(r"function deriveChains\(evaluations, data\) \{\n  return evaluations\.map\(\(evaluation\) => \{\n.*?    let chainStatus = 'applicable_unassessed';", re.S)
          replacement = '''function deriveChains(evaluations, data) {
  return evaluations.map((evaluation) => {
    const controlId = evaluation.entry_id;
    const findings = data.remediations.filter((row) => row.finding_key === controlId || row.finding_key?.startsWith(`${controlId}-`));
    const open = findings.filter((row) => !['verified_closed','accepted_risk'].includes(row.status));
    const currentTests = data.tests.filter((row) => row.entry_id === controlId && (!row.system_snapshot_id || row.system_snapshot_id === evaluation.system_snapshot_id));
    const historicalTests = (data.testHistory || data.tests).filter((row) => row.entry_id === controlId);
    const currentEvidence = data.evidence.filter((row) => row.entry_id === controlId && (!row.system_snapshot_id || row.system_snapshot_id === evaluation.system_snapshot_id));
    const historicalEvidence = (data.evidenceHistory || data.evidence).filter((row) => row.entry_id === controlId);
    const tests = open.length ? historicalTests : currentTests;
    const evidence = currentEvidence;
    const links = data.links.filter((row) => row.entry_id === controlId);
    const implementationRecorded = open.some((row) => !['open'].includes(row.status));
    const openFailureIds = new Set(open.map((row) => parseJson(row.verification_json, {})?.failedExecutionId).filter(Boolean));
    const initialFailure = historicalTests.find((row) => row.result === 'failed' && row.execution_kind !== 'retest' && openFailureIds.has(row.id))
      || tests.find((row) => row.result === 'failed' && row.execution_kind !== 'retest');
    const remediatedSnapshotReady = Boolean(initialFailure?.system_snapshot_id && evaluation.system_snapshot_id !== initialFailure.system_snapshot_id);
    const remediationReadyForRetest = implementationRecorded && remediatedSnapshotReady;
    const passedRetest = historicalTests.some((row)=>validRetest(row,historicalTests,findings));
    const failed = tests.some((row) => row.result === 'failed');
    const passed = currentTests.some((row) => row.result === 'passed');
    const activeEvidence = currentEvidence.some((row) => row.retention_status === 'active' && row.verification_state === 'verified');
    const runtimeRegression = links.some((row) => row.subject_type === 'runtime_event') && data.runtime.some((row) => row.decision === 'deny' && links.some((link) => link.subject_id === row.id));
    const approvalRequired=(data.requirements||[]).some(row=>row.entry_id===controlId);
    const executed=tests.filter(row=>row.result!=='planned');const latest=currentTests[0]||tests[0];const verifiedEvidence=currentEvidence.some(row=>row.retention_status==='active'&&row.verification_state==='verified');
    const failureEvidence=(open.length?historicalEvidence:currentEvidence).some(row=>row.retention_status==='active'&&['unverified','verified'].includes(row.verification_state)&&row.test_execution_id&&row.test_execution_id===initialFailure?.id);
    let chainStatus = 'applicable_unassessed';'''
          source, count = pattern.subn(replacement, source, count=1)
          assert count == 1, 'deriveChains prefix changed'
          path.write_text(source)

          script = Path('scripts/verify-control-intelligence-browser.mjs')
          browser = script.read_text()
          replacements = [
              ('await wait(\'document.body.innerText.includes("Review suggested controls")\');', 'await wait(\'Boolean(document.querySelector("#controls")) && document.body.innerText.includes("0 of 108 controls reviewed")\');', 1),
              ('assert.match(await visibleText(),/require confirmation/);\nawait click(\'[data-bulk-control="ARL-KB-001"]\');', 'assert.match(await visibleText(),/require confirmation/);\nawait navigate(`/control-intelligence.html?projectId=${encodeURIComponent(projectId)}&view=controls`);await wait(\'document.body.innerText.includes("Review suggested controls")\');\nawait click(\'[data-bulk-control="ARL-KB-001"]\');', 1),
              ('await call(\'Page.reload\');await wait(\'document.body.innerText.includes("2 of 108 controls reviewed")\');', 'await navigate(`/control-intelligence.html?projectId=${encodeURIComponent(projectId)}`);await wait(\'document.body.innerText.includes("2 of 108 controls reviewed")\');', 1),
              ('await wait(\'document.body.innerText.includes("Create a finding")\');await call(\'Page.reload\');await wait(\'Boolean(document.querySelector("#evidenceForm"))\');', 'await wait(\'document.body.innerText.includes("Attach observed evidence to the failed test")\');await wait(\'Boolean(document.querySelector("#evidenceForm"))\');', 1),
              ('await click(\'[data-stage="finding"] summary\');', 'await wait(\'document.querySelector("[data-stage=\\"finding\\"]")?.dataset.uxState==="current"\');await click(\'.ci-stage-nav li[data-state="current"] button\');await wait(\'Boolean(document.querySelector("#findingForm"))\');', 1),
              ('await click(\'[data-stage="remediation"] summary\');', 'await wait(\'document.querySelector("[data-stage=\\"remediation\\"]")?.dataset.uxState==="current"\');await click(\'.ci-stage-nav li[data-state="current"] button\');await wait(\'Boolean(document.querySelector("#remediationForm"))\');', 1),
              ('await call(\'Page.reload\');await click(\'[data-stage="remediation"] summary\');', 'await call(\'Page.reload\');await wait(\'Boolean(document.querySelector("#implementationForm"))\');', 1),
              ('await call(\'Page.reload\');await click(\'[data-stage="remediation"] summary\');', 'await call(\'Page.reload\');await wait(\'Boolean(document.querySelector("#snapshotForm"))\');', 1),
              ('await click(\'[data-stage="retest"] summary\');', 'await wait(\'document.querySelector("[data-stage=\\"retest\\"]")?.dataset.uxState==="current"\');await click(\'.ci-stage-nav li[data-state="current"] button\');await wait(\'Boolean(document.querySelector("#retestForm"))\');', 1),
              ('await click(\'[data-stage="approval"] summary\');', 'await wait(\'document.querySelector("[data-stage=\\"approval\\"]")?.dataset.uxState==="current"\');await click(\'.ci-stage-nav li[data-state="current"] button\');await wait(\'Boolean(document.querySelector("#approvalForm"))\');', 1),
              ('await call(\'Page.reload\');await click(\'[data-stage="deployment_decision"] summary\');', 'await call(\'Page.reload\');await wait(\'document.querySelector("[data-stage=\\"deployment_decision\\"]")?.dataset.uxState==="current"\');await click(\'.ci-stage-nav li[data-state="current"] button\');', 1),
          ]
          for old, new, expected in replacements:
              if old in browser:
                  browser = browser.replace(old, new, expected)
          script.write_text(browser)

          ux_test = Path('tests/control-intelligence-ux.test.js')
          tests = ux_test.read_text()
          if "cross-snapshot failure lineage" not in tests:
              tests += '''\n\ntest('cross-snapshot failure lineage is retained only for the open-finding retest path', () => {\n  assert.match(controlIntelligenceSource, /const currentTests = data\\.tests\\.filter/);\n  assert.match(controlIntelligenceSource, /const historicalTests = \\(data\\.testHistory \\|\\| data\\.tests\\)/);\n  assert.match(controlIntelligenceSource, /const currentEvidence = data\\.evidence\\.filter/);\n  assert.match(controlIntelligenceSource, /const historicalEvidence = \\(data\\.evidenceHistory \\|\\| data\\.evidence\\)/);\n  assert.match(controlIntelligenceSource, /const tests = open\\.length \\? historicalTests : currentTests/);\n  assert.match(controlIntelligenceSource, /row\\.test_execution_id===initialFailure\\?\\.id/);\n  assert.match(controlIntelligenceSource, /verifiedEvidence=currentEvidence\\.some/);\n});\n'''
              ux_test.write_text(tests)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Focused workflow tests
        run: node --test tests/control-intelligence-ux.test.js tests/control-intelligence-failure-handoff.test.js
      - name: Full regression suite
        run: npm test
      - name: Commit bounded repair if changed
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "emprex"
          git config user.email "guillaume.strohecker@gmail.com"
          git add src/control-intelligence.js scripts/verify-control-intelligence-browser.mjs tests/control-intelligence-ux.test.js
          git diff --cached --check
          git commit -m "Preserve failure lineage across remediated snapshots"
          git push origin HEAD:fix/cross-snapshot-retest-20260811
