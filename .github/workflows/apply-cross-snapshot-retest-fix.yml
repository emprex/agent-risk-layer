name: Apply cross-snapshot retest repair

on:
  push:
    branches:
      - fix/cross-snapshot-retest-20260811

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cross-snapshot-retest-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply bounded repair
        run: python3 scripts/apply-cross-snapshot-retest-fix.py
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Focused workflow tests
        run: node --test tests/control-intelligence-ux.test.js tests/control-intelligence-failure-handoff.test.js
      - name: Full regression suite
        run: npm test
      - name: Commit bounded repair if changed
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "emprex"
          git config user.email "guillaume.strohecker@gmail.com"
          git add src/control-intelligence.js scripts/verify-control-intelligence-browser.mjs tests/control-intelligence-ux.test.js
          git diff --cached --check
          git commit -m "Preserve failure lineage across remediated snapshots"
          git push origin HEAD:fix/cross-snapshot-retest-20260811
