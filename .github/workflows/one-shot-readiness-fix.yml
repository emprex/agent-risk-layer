name: One-shot production readiness fix

on:
  push:
    branches:
      - fix/production-readiness-gate

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply fail-closed readiness repair
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/config.js')
          text = p.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "export const defaultBindHost = '0.0.0.0';\n",
              "export const defaultBindHost = '0.0.0.0';\nconst resolvedNodeEnv = process.env.NODE_ENV || 'development';\nconst resolvedProductStage = process.env.PRODUCT_STAGE || (resolvedNodeEnv === 'production' ? 'production' : 'development');\n",
          )
          replace_once(
              "    productStage: process.env.PRODUCT_STAGE || 'production',",
              "    productStage: resolvedProductStage,",
          )
          replace_once(
              "    nodeEnv: process.env.NODE_ENV || 'development',",
              "    nodeEnv: resolvedNodeEnv,",
          )
          replace_once(
              "export function launchReadiness() {\n    const checks = [\n        { key: 'production_mode', label: 'NODE_ENV is production', ok: config.nodeEnv === 'production', required: false },",
              "export function launchReadiness() {\n    const productionStage = config.productStage === 'production';\n    const checks = [\n        { key: 'production_mode', label: 'NODE_ENV is production', ok: config.nodeEnv === 'production', required: productionStage },",
          )
          text = text.replace("required: config.nodeEnv === 'production'", "required: productionStage")
          replace_once(
              "    if (config.nodeEnv !== 'production')\n        return readiness;",
              "    if (config.productStage !== 'production')\n        return readiness;",
          )
          p.write_text(text)

          test = Path('tests/production-readiness-mode.test.js')
          test.write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import { spawnSync } from 'node:child_process';

function probe(extraEnv = {}, deleteKeys = []) {
  const env = { ...process.env, ...extraEnv };
  for (const key of deleteKeys) delete env[key];
  const script = `
    import { config, launchReadiness, assertSafeProductionConfig } from './src/config.js';
    const readiness = launchReadiness();
    let startupError = null;
    try { assertSafeProductionConfig(); } catch (error) { startupError = error.message; }
    console.log(JSON.stringify({ config: { nodeEnv: config.nodeEnv, productStage: config.productStage }, readiness, startupError }));
  `;
  const child = spawnSync(process.execPath, ['--input-type=module', '-e', script], { env, encoding: 'utf8' });
  assert.equal(child.status, 0, child.stderr);
  return JSON.parse(child.stdout.trim());
}

test('declared production stage fails closed when NODE_ENV is not production', () => {
  const result = probe({ NODE_ENV: 'development', PRODUCT_STAGE: 'production', DEMO_MODE: 'true' });
  const productionMode = result.readiness.checks.find((check) => check.key === 'production_mode');
  assert.equal(result.config.productStage, 'production');
  assert.equal(result.config.nodeEnv, 'development');
  assert.equal(productionMode.required, true);
  assert.equal(productionMode.ok, false);
  assert.equal(result.readiness.ready, false);
  assert.match(result.startupError || '', /NODE_ENV is production/);
});

test('non-production environments do not inherit a production product stage by default', () => {
  const result = probe({ NODE_ENV: 'test', DEMO_MODE: 'true' }, ['PRODUCT_STAGE']);
  const productionMode = result.readiness.checks.find((check) => check.key === 'production_mode');
  assert.equal(result.config.productStage, 'development');
  assert.equal(productionMode.required, false);
  assert.equal(result.startupError, null);
});

test('NODE_ENV production defaults the product stage to production when PRODUCT_STAGE is omitted', () => {
  const result = probe({ NODE_ENV: 'production', DEMO_MODE: 'true' }, ['PRODUCT_STAGE']);
  assert.equal(result.config.productStage, 'production');
  assert.equal(result.config.nodeEnv, 'production');
  assert.equal(result.readiness.checks.find((check) => check.key === 'production_mode').required, true);
});
''')
      - run: npm ci --ignore-scripts
      - name: Run focused readiness regression
        run: node --test tests/production-readiness-mode.test.js
      - run: npm run check
      - run: git diff --check
      - name: Commit verified repair and remove one-shot workflow
        run: |
          git config user.name "AgentRiskLayer repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-readiness-fix.yml
          git add src/config.js tests/production-readiness-mode.test.js
          git commit -m "Fail closed on production readiness mode"
          git push origin HEAD:fix/production-readiness-gate
