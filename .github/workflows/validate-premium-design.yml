name: Validate premium visual redesign

on:
  push:
    branches:
      - design/premium-visual-system-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Syntax and regression suite
        run: |
          npm run check
          npm test
      - name: Install disposable browser tooling
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start disposable test server
        env:
          NODE_ENV: test
          PORT: '3311'
          HOST: 127.0.0.1
          BASE_URL: http://127.0.0.1:3311
          SESSION_SECRET: premium-design-validation-secret-42-characters-long
          DEMO_MODE: 'true'
          RATE_LIMIT_STORAGE: memory
          SUPPORT_EMAIL: support@example.test
        run: |
          node server.js > /tmp/arl-premium-server.log 2>&1 &
          echo $! > /tmp/arl-premium-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3311/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/arl-premium-server.log
          exit 1
      - name: Audit premium theme across public and authenticated surfaces
        env:
          BROWSER_BASE_URL: http://127.0.0.1:3311
        run: node scripts/validate-premium-design.mjs
      - name: Capture representative redesign previews
        env:
          BROWSER_BASE_URL: http://127.0.0.1:3311
        run: node scripts/capture-premium-design.mjs
      - name: Upload temporary redesign previews
        uses: actions/upload-artifact@v4
        with:
          name: premium-redesign-previews
          path: audit-artifacts/premium-redesign
          if-no-files-found: error
          retention-days: 1
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/arl-premium-server.log || true
