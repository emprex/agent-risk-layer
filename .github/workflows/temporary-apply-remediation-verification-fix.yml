name: Temporary apply remediation verification fix

on:
  push:
    branches: [fix/control-intelligence-workflow-ux-20260811]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/control-intelligence-workflow-ux-20260811
          fetch-depth: 0
      - name: Repair remediation persistence and stage gating
        run: |
          python - <<'PY'
          from pathlib import Path

          plane = Path('src/control-plane.js')
          text = plane.read_text()
          old_sanitizer = """function sanitiseVerificationInput(input) {\n  const safe = privacySafeObject(input, 30);\n  const allowed = new Set(['artifactId', 'reference', 'retestReference', 'notes', 'rootCause', 'correctiveAction', 'targetEnvironment', 'rollbackPlan', 'validationPlan', 'changeReference', 'limitations']);\n  return Object.fromEntries(Object.entries(safe).filter(([key]) => allowed.has(key)));\n}"""
          new_sanitizer = """function sanitiseVerificationInput(input) {\n  if (!input || typeof input !== 'object' || Array.isArray(input)) return {};\n  const limits = Object.freeze({\n    artifactId: 100,\n    reference: 500,\n    retestReference: 500,\n    notes: 3000,\n    rootCause: 2000,\n    correctiveAction: 4000,\n    targetEnvironment: 500,\n    rollbackPlan: 2000,\n    validationPlan: 3000,\n    changeReference: 500,\n    limitations: 3000,\n  });\n  const output = {};\n  for (const [key, maxLength] of Object.entries(limits)) {\n    if (!Object.hasOwn(input, key) || input[key] == null || typeof input[key] !== 'string') continue;\n    output[key] = clean(input[key], maxLength);\n  }\n  return output;\n}"""
          if old_sanitizer in text:
              text = text.replace(old_sanitizer, new_sanitizer, 1)
          elif new_sanitizer not in text:
              raise SystemExit('Expected remediation verification sanitizer was not found.')
          plane.write_text(text)

          intelligence = Path('src/control-intelligence.js')
          text = intelligence.read_text()
          old_status = "else if (open.length && remediating) chainStatus = 'remediation_in_progress';"
          new_status = "else if (open.length && implementationRecorded) chainStatus = 'remediation_in_progress';"
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif new_status not in text:
              raise SystemExit('Expected remediation chain status reference was not found.')
          intelligence.write_text(text)
          PY
      - name: Commit patch when needed
        run: |
          if git diff --quiet -- src/control-plane.js src/control-intelligence.js; then exit 0; fi
          git config user.name "AgentRiskLayer CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/control-plane.js src/control-intelligence.js
          git commit -m "Preserve remediation evidence and workflow state"
          git push origin HEAD:fix/control-intelligence-workflow-ux-20260811
