name: Apply observed retest closure review patch

on:
  push:
    branches:
      - fix-observed-retest-closure-review

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node scripts/apply-observed-retest-closure-review.mjs
      - name: Remove one-shot patch machinery
        run: rm -f scripts/apply-observed-retest-closure-review.mjs .github/workflows/apply-observed-retest-closure-review.yml
      - name: Commit patched product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add accountable observed retest closure review'
          git push origin HEAD:fix-observed-retest-closure-review
