name: Finalize service cutover

on:
  push:
    branches:
      - phase-5-legal-and-billing-cleanup

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5-legal-and-billing-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic cutover
        run: |
          sed -i '221,222d' scripts/finalize-service-cutover.mjs
          node --check scripts/finalize-service-cutover.mjs
          node scripts/finalize-service-cutover.mjs
      - name: Validate syntax
        run: npm run check
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove executable legacy commercial runtime"
          git push origin HEAD:phase-5-legal-and-billing-cleanup
