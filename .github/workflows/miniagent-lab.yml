name: Miniagent isolated lab dossier

on:
  pull_request:
    paths:
      - 'scripts/miniagent-pilot-lab.py'
      - 'tests/test_miniagent_pilot_lab_contract.py'
      - 'risk-knowledge/risk-knowledge-v1.json'
      - '.github/workflows/miniagent-lab.yml'

permissions:
  contents: read

jobs:
  offline-dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Python syntax and synthetic dossier regression
        run: |
          python3 -m py_compile scripts/miniagent-pilot-lab.py tests/test_miniagent_pilot_lab_contract.py
          python3 -m unittest discover -s tests -p 'test_miniagent_pilot_lab_contract.py' -v
