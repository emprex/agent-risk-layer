name: Temporary assessment evidence/result fix

on:
  push:
    branches:
      - fix/assessment-evidence-result-semantics-20260808

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply targeted fixes
        shell: bash
        run: |
          python .github/temp-assessment-patch.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/risk-engine.js')
          text = p.read_text()
          replacements = [
              (
                  "  const highestSeverity = (items) => items.reduce((highest, item) => severityRank[item.severity] > severityRank[highest] ? item.severity : highest, '');",
                  "  const highestSeverity = (items) => items.reduce((highest, item) => (severityRank[item.severity] || 0) > (severityRank[highest] || 0) ? item.severity : highest, '');",
              ),
              (
                  "  const highestMaterialSeverity = severityRank[highestFindingSeverity] >= severityRank[highestAttackPathSeverity] ? highestFindingSeverity : highestAttackPathSeverity;",
                  "  const highestMaterialSeverity = (severityRank[highestFindingSeverity] || 0) >= (severityRank[highestAttackPathSeverity] || 0) ? highestFindingSeverity : highestAttackPathSeverity;",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected severity line not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Validate release
        run: npm run validate
      - name: Commit validated fixes and remove temporary tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-assessment-evidence-fix.yml .github/temp-assessment-patch.py
          git add src/config.js src/risk-engine.js src/report.js src/pdf.js public/assessment.js public/assessment.html public/result.js server.js tests/risk-engine.test.js tests/customer-journey.test.js docs/ASSESSMENT_EVIDENCE_SEMANTICS.md
          git commit -m "Fix assessment evidence and result semantics [skip ci]"
          git push origin HEAD
