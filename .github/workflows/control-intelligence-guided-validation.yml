name: Control Intelligence guided workflow validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/control-intelligence-*'
      - 'src/control-intelligence*'
      - 'tests/control-intelligence*'
      - '.github/workflows/control-intelligence-guided-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentrisk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentrisk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agentrisk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Initialize PostgreSQL schema
        run: node --input-type=module -e "import { initialiseDatabase } from './src/db.js'; await initialiseDatabase();"
      - run: node --test tests/control-intelligence-journey.test.js tests/control-intelligence-failure-handoff.test.js tests/control-intelligence-ux.test.js
      - run: npm test
