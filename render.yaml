services:
  - type: web
    name: agent-risk-layer
    runtime: docker
    plan: starter
    healthCheckPath: /api/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRODUCT_STAGE
        value: production
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agent-risk-layer-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: DATABASE_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: DATABASE_LOCK_TIMEOUT_MS
        value: "5000"
      - key: DEMO_MODE
        value: "false"
      - key: ALLOW_DEMO_IN_PRODUCTION
        value: "false"
      - key: SESSION_IDLE_HOURS
        value: "12"
      - key: SESSION_ABSOLUTE_DAYS
        value: "7"
      - key: EMAIL_VERIFICATION_HOURS
        value: "24"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: FULFILMENT_WORKER_INTERVAL_MS
        value: "15000"
      - key: RETENTION_WORKER_INTERVAL_MS
        value: "3600000"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: COMPANY_NAME
        value: AgentRiskLayer
      - key: COMPANY_LEGAL_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: LEGAL_JURISDICTION
        value: England and Wales
      - key: SUPPORT_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_API_VERSION
        value: 2026-06-24.dahlia
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_REPORT
        sync: false
      - key: STRIPE_PRICE_DEVELOPER_MONTHLY
        sync: false
      - key: STRIPE_PRICE_TEAM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_AGENCY_MONTHLY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: agent-risk-layer-db
    plan: basic-1gb
    region: oregon
    diskSizeGB: 25
    storageAutoscalingEnabled: true
    postgresMajorVersion: "18"
    databaseName: agentrisklayer
    user: agentrisklayer
    ipAllowList: []
