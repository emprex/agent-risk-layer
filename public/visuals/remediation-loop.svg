<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none" role="img" aria-labelledby="title desc"><title id="title">Remediation and retest loop</title><desc id="desc">Illustrative loop showing a failed finding, remediation, changed version, exact retest and closure only after evidence.</desc><rect width="900" height="520" rx="30" fill="#F4F8FC"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0877F9"/></marker></defs><g font-family="Arial,sans-serif"><g><rect x="70" y="205" width="150" height="105" rx="20" fill="#FFF3F3" stroke="#D94141" stroke-width="2"/><text x="145" y="246" text-anchor="middle" font-weight="700" fill="#B52F2F">Finding</text><text x="145" y="273" text-anchor="middle" font-size="13" fill="#6A7685">Control failed</text></g><g><rect x="280" y="205" width="150" height="105" rx="20" fill="#fff" stroke="#0877F9" stroke-width="2"/><text x="355" y="246" text-anchor="middle" font-weight="700" fill="#0B1728">Remediation</text><text x="355" y="273" text-anchor="middle" font-size="13" fill="#6A7685">Implement change</text></g><g><rect x="490" y="205" width="150" height="105" rx="20" fill="#FFF8E8" stroke="#D78A00" stroke-width="2"/><text x="565" y="246" text-anchor="middle" font-weight="700" fill="#0B1728">Changed version</text><text x="565" y="273" text-anchor="middle" font-size="13" fill="#8E6A20">New snapshot</text></g><g><rect x="700" y="205" width="130" height="105" rx="20" fill="#EEF9F3" stroke="#20A464" stroke-width="2"/><text x="765" y="246" text-anchor="middle" font-weight="700" fill="#19774A">Exact retest</text><text x="765" y="273" text-anchor="middle" font-size="13" fill="#4D7761">Pass or fail</text></g><path d="M220 257H270" stroke="#0877F9" stroke-width="3" marker-end="url(#arrow)"/><path d="M430 257H480" stroke="#0877F9" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 257H690" stroke="#0877F9" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 205C765 110 146 105 146 195" stroke="#0877F9" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="455" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#0877F9">If retest fails, the finding stays open and the loop continues</text><text x="450" y="394" text-anchor="middle" font-size="24" font-weight="700" fill="#0B1728">A fix is not closure evidence.</text><text x="450" y="425" text-anchor="middle" font-size="14" fill="#5B6D81">Closure depends on the changed system, exact retest and current evidence.</text></g></svg>