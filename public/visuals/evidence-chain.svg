<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none" role="img" aria-labelledby="title desc"><title id="title">Evidence chain</title><desc id="desc">Illustrative chain from declared controls to deployment decision.</desc><rect width="900" height="520" rx="30" fill="#F4F8FC"/><path d="M74 260H826" stroke="#C7D8E7" stroke-width="4"/><path d="M74 260H826" stroke="#0877F9" stroke-width="4" stroke-dasharray="72 26"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(90 260)"><circle r="34" fill="#fff" stroke="#0877F9" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#0B1728">01</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Declared</text></g><g transform="translate(180 260)"><circle r="34" fill="#fff" stroke="#0877F9" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#0B1728">02</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Observed</text></g><g transform="translate(270 260)"><circle r="34" fill="#FFF4F4" stroke="#D94141" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#B63131">03</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Finding</text></g><g transform="translate(360 260)"><circle r="34" fill="#fff" stroke="#0877F9" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#0B1728">04</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Red team</text></g><g transform="translate(450 260)"><circle r="34" fill="#fff" stroke="#0877F9" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#0B1728">05</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Runtime</text></g><g transform="translate(540 260)"><circle r="34" fill="#FFF8E8" stroke="#D78A00" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#8E5A00">06</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Approval</text></g><g transform="translate(630 260)"><circle r="34" fill="#fff" stroke="#0877F9" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#0B1728">07</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Remediate</text></g><g transform="translate(720 260)"><circle r="34" fill="#EEF9F3" stroke="#20A464" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#19774A">08</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Retest</text></g><g transform="translate(810 260)"><circle r="34" fill="#EEF9F3" stroke="#20A464" stroke-width="2"/><text y="5" font-size="14" font-weight="700" fill="#19774A">09</text><text y="70" font-size="13" font-weight="700" fill="#0B1728">Decision</text></g></g><text x="450" y="96" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#0B1728">Claim → evidence → remediation → exact retest → decision</text><text x="450" y="426" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5B6D81">Illustrative workflow. A deployment decision depends on the current evidence and unresolved blockers.</text></svg>