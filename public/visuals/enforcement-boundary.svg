<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" fill="none" role="img" aria-labelledby="title desc"><title id="title">Runtime enforcement boundary</title><desc id="desc">Illustrative runtime flow from AI agent through AgentRiskLayer policy and exact-action approval to a tool or API.</desc><rect width="900" height="520" rx="30" fill="#071321"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5AAEFF"/></marker></defs><g font-family="Arial,sans-serif"><rect x="70" y="190" width="190" height="140" rx="24" fill="#0B1B2D" stroke="#284763"/><text x="165" y="237" text-anchor="middle" font-size="12" fill="#91A8BF" letter-spacing="2">PROPOSED ACTION</text><text x="165" y="272" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">AI agent</text><text x="165" y="300" text-anchor="middle" font-size="13" fill="#AFC4D7">refund_order()</text><rect x="355" y="155" width="190" height="210" rx="26" fill="#0C2845" stroke="#18B8FF" stroke-width="2"/><text x="450" y="207" text-anchor="middle" font-size="12" fill="#8FDDFF" letter-spacing="2">ENFORCEMENT</text><text x="450" y="244" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">AgentRiskLayer</text><text x="450" y="278" text-anchor="middle" font-size="13" fill="#AFC4D7">policy · context · approval</text><g><rect x="386" y="302" width="64" height="30" rx="15" fill="#163A2A"/><text x="418" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#8CE1B4">ALLOW</text><rect x="458" y="302" width="58" height="30" rx="15" fill="#411F22"/><text x="487" y="322" text-anchor="middle" font-size="11" font-weight="700" fill="#FFB3B0">DENY</text></g><rect x="640" y="190" width="190" height="140" rx="24" fill="#0B1B2D" stroke="#284763"/><text x="735" y="237" text-anchor="middle" font-size="12" fill="#91A8BF" letter-spacing="2">SIDE EFFECT</text><text x="735" y="272" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Tool / API</text><text x="735" y="300" text-anchor="middle" font-size="13" fill="#AFC4D7">only after decision</text><path d="M260 260H342" stroke="#5AAEFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M545 260H627" stroke="#5AAEFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M450 155V86" stroke="#D78A00" stroke-width="2.5" stroke-dasharray="7 7"/><rect x="355" y="45" width="190" height="55" rx="18" fill="#2A2110" stroke="#D78A00"/><text x="450" y="79" text-anchor="middle" font-size="14" font-weight="700" fill="#FFD17A">Exact-action approval</text><text x="450" y="430" text-anchor="middle" font-size="14" fill="#9FB2C7">The model proposes. The enforcement layer decides whether the action can reach the tool.</text></g></svg>