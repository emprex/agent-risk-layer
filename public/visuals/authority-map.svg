<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" fill="none" role="img" aria-labelledby="title desc"><title id="title">Agent authority map</title><desc id="desc">An illustrative AI agent connected to files, APIs, memory, payments, human approval and evidence.</desc><defs><linearGradient id="bg" x1="60" y1="30" x2="840" y2="520"><stop stop-color="#071321"/><stop offset="1" stop-color="#0D2035"/></linearGradient><linearGradient id="line" x1="100" y1="280" x2="800" y2="280"><stop stop-color="#0877F9"/><stop offset=".5" stop-color="#18B8FF"/><stop offset="1" stop-color="#20A464"/></linearGradient></defs><rect x="10" y="10" width="880" height="540" rx="34" fill="url(#bg)"/><g stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" opacity=".72"><path d="M450 280L164 140"/><path d="M450 280L736 140"/><path d="M450 280L154 420"/><path d="M450 280L746 420"/><path d="M450 280L590 92"/><path d="M450 280L310 478"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#fff"><g><rect x="365" y="215" width="170" height="130" rx="24" fill="#0C2845" stroke="#18B8FF" stroke-width="2"/><text x="450" y="267" text-anchor="middle" font-size="12" fill="#8FDDFF" letter-spacing="2">AI SYSTEM</text><text x="450" y="298" text-anchor="middle" font-weight="700">AI AGENT</text><text x="450" y="322" text-anchor="middle" font-size="12" fill="#A7BED2">authority under review</text></g><g><rect x="84" y="98" width="160" height="84" rx="18" fill="#0B1B2D" stroke="#31506D"/><text x="164" y="133" text-anchor="middle" font-weight="700">Files</text><text x="164" y="157" text-anchor="middle" font-size="12" fill="#9FB6CB">read · write</text></g><g><rect x="656" y="98" width="160" height="84" rx="18" fill="#0B1B2D" stroke="#31506D"/><text x="736" y="133" text-anchor="middle" font-weight="700">APIs / MCP</text><text x="736" y="157" text-anchor="middle" font-size="12" fill="#9FB6CB">tool actions</text></g><g><rect x="74" y="378" width="160" height="84" rx="18" fill="#0B1B2D" stroke="#31506D"/><text x="154" y="413" text-anchor="middle" font-weight="700">Memory</text><text x="154" y="437" text-anchor="middle" font-size="12" fill="#9FB6CB">state · retrieval</text></g><g><rect x="666" y="378" width="160" height="84" rx="18" fill="#251719" stroke="#D94141"/><text x="746" y="413" text-anchor="middle" font-weight="700">Payments</text><text x="746" y="437" text-anchor="middle" font-size="12" fill="#FFB4B0">high impact</text></g><g><rect x="510" y="50" width="160" height="84" rx="18" fill="#271F10" stroke="#D78A00"/><text x="590" y="85" text-anchor="middle" font-weight="700">Human approval</text><text x="590" y="109" text-anchor="middle" font-size="12" fill="#FFD17A">exact action</text></g><g><rect x="230" y="436" width="160" height="84" rx="18" fill="#10271C" stroke="#20A464"/><text x="310" y="471" text-anchor="middle" font-weight="700">Evidence</text><text x="310" y="495" text-anchor="middle" font-size="12" fill="#8CE1B4">recorded decision</text></g></g></svg>